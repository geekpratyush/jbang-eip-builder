<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Truncation & Enrichment Rules</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-200 h-screen p-8">
    <h1 class="text-2xl font-bold mb-6 text-emerald-400">Data Grid: Enrichment Rules</h1>
    <div class="bg-slate-800 p-6 rounded-lg border border-slate-700 mb-8">
        <h2 class="text-lg mb-4">Add New Rule</h2>
        <div class="flex gap-4">
            <input type="text" placeholder="Source Field" class="bg-slate-900 border border-slate-700 rounded px-3 py-2 flex-1 text-white">
            <input type="text" placeholder="Target Field" class="bg-slate-900 border border-slate-700 rounded px-3 py-2 flex-1 text-white">
            <input type="number" placeholder="Max Length" class="bg-slate-900 border border-slate-700 rounded px-3 py-2 w-32 text-white">
            <select class="bg-slate-900 border border-slate-700 rounded px-3 py-2 flex-1 text-white">
                <option>TRUNCATE_RIGHT</option>
                <option>TRUNCATE_LEFT</option>
                <option>ERROR</option>
            </select>
            <button class="bg-emerald-600 px-4 py-2 rounded text-white font-bold">+</button>
        </div>
    </div>
    <table class="w-full text-left bg-slate-800 rounded-lg overflow-hidden border border-slate-700">
        <thead class="bg-slate-900 text-slate-400">
            <tr>
                <th class="p-4">Source Field</th>
                <th class="p-4">Target Field</th>
                <th class="p-4">Max Length</th>
                <th class="p-4">Strategy</th>
                <th class="p-4">Enrichment Source</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-slate-700">
            <tr>
                <td class="p-4 font-mono">/msg/SenderName</td>
                <td class="p-4 font-mono">/Dbtr/Nm</td>
                <td class="p-4">35</td>
                <td class="p-4 text-emerald-400">TRUNCATE_RIGHT</td>
                <td class="p-4 text-slate-500">N/A</td>
            </tr>
            <tr>
                <td class="p-4 font-mono">/msg/BIC</td>
                <td class="p-4 font-mono">/Agt/FinInstnId/BICFI</td>
                <td class="p-4">11</td>
                <td class="p-4 text-red-400">ERROR</td>
                <td class="p-4 text-blue-400">REDIS_LOOKUP</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
