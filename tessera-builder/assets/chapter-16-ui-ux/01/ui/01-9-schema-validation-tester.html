<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Schema Validation Tester</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-200 h-screen flex flex-col">
    <header class="bg-slate-800 p-4 border-b border-slate-700 flex justify-between items-center">
        <h1 class="text-xl font-bold text-rose-400">Schema Validation Tester</h1>
        <button class="bg-rose-600 hover:bg-rose-500 text-white px-4 py-2 rounded" onclick="validate()">Validate Payload</button>
    </header>
    <div class="flex-1 flex overflow-hidden">
        <div class="w-1/2 relative border-r border-slate-700" id="editor"></div>
        <div class="w-1/2 flex flex-col">
            <div class="p-6 bg-slate-850 border-b border-slate-700 flex justify-center items-center h-48">
                <div id="status-card" class="w-full max-w-md p-6 rounded-lg text-center bg-slate-800 border border-slate-700">
                    <h2 class="text-xl font-bold text-slate-400">Awaiting Validation</h2>
                </div>
            </div>
            <div class="flex-1 bg-black p-4 font-mono text-sm text-rose-500 overflow-y-auto" id="terminal">
                > Ready.
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>
    <script>
        let editor;
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: "{
  "transactionId": "ABC12345",
  "amount": -500.00
}",
                language: "json", theme: "vs-dark", automaticLayout: true
            });
        });
        function validate() {
            document.getElementById('status-card').className = 'w-full max-w-md p-6 rounded-lg text-center bg-rose-900/30 border border-rose-500';
            document.getElementById('status-card').innerHTML = '<h2 class="text-2xl font-bold text-rose-500">Validation Failed</h2><p class="mt-2 text-rose-300">2 Errors Found</p>';
            document.getElementById('terminal').innerHTML = '> Validating schema compliance...
> ERROR: [amount] must be greater than 0.
> ERROR: Missing required field [currency].';
        }
    </script>
</body>
</html>
