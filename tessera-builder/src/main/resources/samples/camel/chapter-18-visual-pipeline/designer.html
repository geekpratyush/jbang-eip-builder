<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tessera Visual Route Designer - Portable</title>
    <!-- Portable CDN Imports -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .canvas-grid {
            background-image: radial-gradient(#334155 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .node-dragging { opacity: 0.6; cursor: grabbing !important; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        // --- Data: Camel Components ---
        const CAMEL_COMPONENTS = [
            {
                category: "Core Components",
                items: [
                    { id: 'timer', label: 'Timer', icon: 'clock', type: 'source', description: 'Generate periodic messages', defaultData: { uri: 'timer:tick?period=5000' } },
                    { id: 'log', label: 'Log', icon: 'file-text', type: 'step', description: 'Log message to console', defaultData: { uri: 'log:info' } },
                    { id: 'direct', label: 'Direct', icon: 'arrow-right', type: 'both', description: 'Synchronous invocation', defaultData: { uri: 'direct:start' } },
                    { id: 'file', label: 'File', icon: 'folder', type: 'both', description: 'Read/Write files', defaultData: { uri: 'file:data/input' } },
                    { id: 'set-body', label: 'Set Body', icon: 'type', type: 'step', description: 'Set message body', defaultData: { expression: { simple: 'Hello World' } } },
                    { id: 'set-header', label: 'Set Header', icon: 'tag', type: 'step', description: 'Set message header', defaultData: { name: 'myHeader', expression: { simple: 'myValue' } } },
                ]
            },
            {
                category: "EIP Patterns",
                items: [
                    { 
                        id: 'choice', 
                        label: 'Choice', 
                        icon: 'split', 
                        type: 'step', 
                        description: 'Content-based router', 
                        isComplex: true,
                        scaffold: [
                            { id: 'when-1', label: 'When', data: { expression: { simple: '${header.type} == "A"' } } },
                            { id: 'when-2', label: 'When', data: { expression: { simple: '${header.type} == "B"' } } },
                            { id: 'otherwise', label: 'Otherwise', data: {} }
                        ]
                    },
                    { 
                        id: 'split', 
                        label: 'Split', 
                        icon: 'layers', 
                        type: 'step', 
                        description: 'Split message into parts',
                        isComplex: true,
                        scaffold: [
                            { id: 'split-step-1', label: 'Item Processor', data: { uri: 'log:split-item' } }
                        ],
                        defaultData: { expression: { simple: '${body}' } }
                    },
                    { id: 'aggregate', label: 'Aggregate', icon: 'combine', type: 'step', description: 'Combine multiple messages', defaultData: { strategyRef: 'myStrategy', completionSize: 5 } },
                    { id: 'wire-tap', label: 'Wire Tap', icon: 'trello', type: 'step', description: 'Send a copy to another endpoint', defaultData: { uri: 'direct:tap' } },
                ]
            },
            {
                category: "Transformation",
                items: [
                    { id: 'xslt-saxon', label: 'XSLT (Saxon)', icon: 'zap', type: 'step', description: 'XML transformation using XSLT', defaultData: { uri: 'xslt-saxon:transform.xsl' } },
                    { id: 'jslt', label: 'JSLT', icon: 'code', type: 'step', description: 'JSON transformation', defaultData: { uri: 'jslt:transform.jslt' } },
                    { id: 'groovy', label: 'Groovy', icon: 'scroll-text', type: 'step', description: 'Execute Groovy script', defaultData: { expression: { groovy: 'request.body = "Fixed"' } } },
                    { id: 'joor', label: 'jOOR', icon: 'coffee', type: 'step', description: 'Java runtime expression', defaultData: { expression: { joor: 'body.toUpperCase()' } } },
                    { id: 'smooks', label: 'Smooks', icon: 'box-select', type: 'step', description: 'Data mapping and processing', defaultData: { configuration: 'smooks-config.xml' } },
                    { id: 'flatpack', label: 'Flatpack', icon: 'align-justify', type: 'step', description: 'Fixed width/delimited files', defaultData: { uri: 'flatpack:fixed:mapping.pzmap.xml' } },
                ]
            },
            {
                category: "SWIFT / Financial",
                items: [
                    { id: 'unmarshal-swift-mt', label: 'Unmarshal MT', icon: 'unfold-vertical', type: 'step', description: 'Decode SWIFT MT message', defaultData: { format: 'swift-mt' } },
                    { id: 'unmarshal-swift-mx', label: 'Unmarshal MX', icon: 'unfold-vertical', type: 'step', description: 'Decode SWIFT MX (ISO20022)', defaultData: { format: 'swift-mx' } },
                    { id: 'marshal-swift-mt', label: 'Marshal MT', icon: 'fold-vertical', type: 'step', description: 'Encode SWIFT MT message', defaultData: { format: 'swift-mt' } },
                    { id: 'marshal-swift-mx', label: 'Marshal MX', icon: 'fold-vertical', type: 'step', description: 'Encode SWIFT MX (ISO20022)', defaultData: { format: 'swift-mx' } },
                ]
            }
        ];

        // --- Helper: Create Icons ---
        const Icon = ({ name, className }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        // --- Components ---

        const PaletteItem = ({ item }) => {
            const onDragStart = (e) => {
                e.dataTransfer.setData('component', JSON.stringify(item));
            };

            return (
                <div 
                    draggable 
                    onDragStart={onDragStart}
                    className="flex items-center gap-3 p-2 bg-slate-800/50 border border-slate-700 rounded-lg cursor-grab hover:bg-slate-700 hover:border-blue-500/50 transition-all group"
                >
                    <div className="p-1.5 bg-slate-700 rounded group-hover:bg-blue-900/50 group-hover:text-blue-400 transition-colors">
                        <Icon name={item.icon} className="w-4 h-4" />
                    </div>
                    <div className="flex flex-col overflow-hidden">
                        <span className="text-sm font-medium truncate">{item.label}</span>
                        <span className="text-[10px] text-slate-500 truncate">{item.description}</span>
                    </div>
                </div>
            );
        };

        const Palette = ({ search, setSearch }) => {
            const [expanded, setExpanded] = useState(CAMEL_COMPONENTS.map(c => c.category));

            const toggle = (cat) => {
                setExpanded(prev => prev.includes(cat) ? prev.filter(c => c !== cat) : [...prev, cat]);
            };

            const filtered = CAMEL_COMPONENTS.map(cat => ({
                ...cat,
                items: cat.items.filter(i => 
                    i.label.toLowerCase().includes(search.toLowerCase()) || 
                    i.description.toLowerCase().includes(search.toLowerCase())
                )
            })).filter(cat => cat.items.length > 0);

            return (
                <div className="w-64 bg-slate-900 border-r border-slate-800 flex flex-col h-full overflow-hidden shrink-0">
                    <div className="p-4 border-b border-slate-800">
                        <h2 className="text-xs font-bold uppercase tracking-widest text-blue-500 mb-3">Palette</h2>
                        <div className="relative">
                            <Icon name="search" className="absolute left-2 top-2.5 w-3.5 h-3.5 text-slate-500" />
                            <input 
                                type="text" 
                                placeholder="Search..." 
                                className="w-full bg-slate-850 border border-slate-700 rounded-md py-1.5 pl-8 pr-3 text-xs focus:ring-1 focus:ring-blue-500 outline-none"
                                value={search}
                                onChange={e => setSearch(e.target.value)}
                            />
                        </div>
                    </div>
                    <div className="flex-1 overflow-y-auto p-2 scrollbar-hide">
                        {filtered.map(cat => (
                            <div key={cat.category} className="mb-2">
                                <button 
                                    onClick={() => toggle(cat.category)}
                                    className="flex items-center gap-1 text-[10px] font-bold uppercase text-slate-500 mb-1 hover:text-slate-300 w-full text-left p-1"
                                >
                                    <Icon name={expanded.includes(cat.category) ? 'chevron-down' : 'chevron-right'} className="w-3 h-3" />
                                    {cat.category}
                                </button>
                                {expanded.includes(cat.category) && (
                                    <div className="space-y-1 mt-1">
                                        {cat.items.map(item => <PaletteItem key={item.id} item={item} />)}
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const Node = ({ node, isSelected, onClick, onMouseDown }) => {
            return (
                <div 
                    style={{ left: node.x, top: node.y }}
                    onMouseDown={(e) => onMouseDown(e, node)}
                    onClick={(e) => { e.stopPropagation(); onClick(node); }}
                    className={`absolute px-4 py-3 rounded-xl border-2 transition-shadow min-w-[180px] cursor-grab shadow-2xl flex flex-col gap-2 z-10 select-none ${
                        isSelected 
                            ? 'border-blue-500 bg-blue-900/30 ring-4 ring-blue-500/10' 
                            : 'border-slate-700 bg-slate-800 hover:border-slate-500'
                    }`}
                >
                    <div className="flex items-center gap-3">
                        <div className={`p-2 rounded-lg ${isSelected ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-300'}`}>
                            <Icon name={node.icon} className="w-5 h-5" />
                        </div>
                        <div className="flex flex-col overflow-hidden">
                            <span className="text-xs font-bold truncate">{node.label}</span>
                            <span className="text-[10px] text-slate-500 font-mono truncate">
                                {node.data?.uri || (node.data?.expression ? 'eip' : 'processor')}
                            </span>
                        </div>
                    </div>
                    {isSelected && (
                        <div className="absolute -top-2 -right-2 bg-blue-500 w-4 h-4 rounded-full border-2 border-slate-900 shadow-lg"></div>
                    )}
                </div>
            );
        };

        const Canvas = ({ nodes, setNodes, selectedNode, setSelectedNode }) => {
            const canvasRef = useRef(null);
            const [zoom, setZoom] = useState(1);
            const [offset, setOffset] = useState({ x: 0, y: 0 });
            const [draggingNode, setDraggingNode] = useState(null);
            const [dragStart, setDragStart] = useState({ x: 0, y: 0 });

            const onDrop = (e) => {
                e.preventDefault();
                const component = JSON.parse(e.dataTransfer.getData('component'));
                const rect = canvasRef.current.getBoundingClientRect();
                const x = (e.clientX - rect.left - offset.x) / zoom;
                const y = (e.clientY - rect.top - offset.y) / zoom;

                const newNodeId = `node-${Date.now()}`;
                const newNode = {
                    id: newNodeId,
                    ...component,
                    x, y,
                    data: { ...component.defaultData }
                };

                let addedNodes = [newNode];

                if (component.isComplex && component.scaffold) {
                    component.scaffold.forEach((s, idx) => {
                        const isChoice = component.id === 'choice';
                        addedNodes.push({
                            id: `${newNodeId}-${idx}`,
                            ...s,
                            icon: s.id.includes('when') ? 'arrow-right' : 'corner-down-right',
                            x: x + (isChoice ? (idx - 1) * 200 : 0),
                            y: y + (isChoice ? 150 : (idx + 1) * 100),
                            data: { ...s.data }
                        });
                    });
                }

                setNodes(prev => [...prev, ...addedNodes]);
                setSelectedNode(newNode);
            };

            const onWheel = (e) => {
                if (e.ctrlKey) {
                    e.preventDefault();
                    const delta = e.deltaY > 0 ? 0.9 : 1.1;
                    setZoom(prev => Math.min(Math.max(prev * delta, 0.2), 3));
                } else if (e.altKey) {
                    setOffset(prev => ({ x: prev.x - e.deltaX, y: prev.y - e.deltaY }));
                }
            };

            const handleMouseDown = (e, node) => {
                if (e.button !== 0) return; // Only left click
                setDraggingNode(node);
                setDragStart({ x: e.clientX, y: e.clientY });
            };

            const handleMouseMove = useCallback((e) => {
                if (!draggingNode) return;
                
                const dx = (e.clientX - dragStart.x) / zoom;
                const dy = (e.clientY - dragStart.y) / zoom;

                setNodes(prev => prev.map(n => 
                    n.id === draggingNode.id 
                        ? { ...n, x: n.x + dx, y: n.y + dy } 
                        : n
                ));
                
                setDragStart({ x: e.clientX, y: e.clientY });
            }, [draggingNode, dragStart, zoom, setNodes]);

            const handleMouseUp = () => {
                setDraggingNode(null);
            };

            useEffect(() => {
                if (draggingNode) {
                    window.addEventListener('mousemove', handleMouseMove);
                    window.addEventListener('mouseup', handleMouseUp);
                } else {
                    window.removeEventListener('mousemove', handleMouseMove);
                    window.removeEventListener('mouseup', handleMouseUp);
                }
                return () => {
                    window.removeEventListener('mousemove', handleMouseMove);
                    window.removeEventListener('mouseup', handleMouseUp);
                };
            }, [draggingNode, handleMouseMove]);

            return (
                <div 
                    ref={canvasRef}
                    className="flex-1 h-full relative overflow-hidden canvas-grid cursor-crosshair"
                    onDragOver={e => e.preventDefault()}
                    onDrop={onDrop}
                    onWheel={onWheel}
                    onClick={() => setSelectedNode(null)}
                >
                    <div 
                        style={{ 
                            transform: `translate(${offset.x}px, ${offset.y}px) scale(${zoom})`, 
                            transformOrigin: '0 0' 
                        }}
                        className="w-full h-full transition-transform duration-75"
                    >
                        {nodes.map(node => (
                            <Node 
                                key={node.id} 
                                node={node} 
                                isSelected={selectedNode?.id === node.id}
                                onClick={setSelectedNode}
                                onMouseDown={handleMouseDown}
                            />
                        ))}
                    </div>
                    <div className="absolute bottom-6 right-6 flex flex-col gap-2 z-30">
                        <button onClick={() => setZoom(z => z * 1.1)} className="p-2 bg-slate-800 border border-slate-700 rounded-lg hover:bg-slate-700 shadow-xl" title="Zoom In"><Icon name="zoom-in" className="w-4 h-4"/></button>
                        <button onClick={() => setZoom(z => z * 0.9)} className="p-2 bg-slate-800 border border-slate-700 rounded-lg hover:bg-slate-700 shadow-xl" title="Zoom Out"><Icon name="zoom-out" className="w-4 h-4"/></button>
                        <button onClick={() => { setZoom(1); setOffset({x:0,y:0}); }} className="p-2 bg-slate-800 border border-slate-700 rounded-lg hover:bg-slate-700 shadow-xl text-[10px] font-bold uppercase" title="Reset View">Reset</button>
                        <div className="bg-slate-800/80 px-2 py-1 rounded text-[10px] font-mono border border-slate-700 text-center">
                            {Math.round(zoom * 100)}%
                        </div>
                    </div>
                    <div className="absolute top-6 right-6 bg-slate-900/80 px-4 py-2 rounded-lg border border-slate-700 text-[10px] text-slate-500 z-30 pointer-events-none">
                        <span className="font-bold text-slate-300">HINTS:</span> DRAG items to move • CTRL + SCROLL to zoom • ALT + SCROLL to pan
                    </div>
                </div>
            );
        };

        const Properties = ({ selectedNode, updateNode }) => {
            const [activeTab, setActiveTab] = useState('config');

            if (!selectedNode) return (
                <div className="w-80 bg-slate-900 border-l border-slate-800 flex flex-col items-center justify-center p-8 text-center text-slate-600 shrink-0">
                    <Icon name="settings" className="w-12 h-12 mb-4 opacity-10" />
                    <p className="text-xs italic font-medium">Select a node to edit properties</p>
                </div>
            );

            const generateYaml = () => {
                const route = {
                    [selectedNode.id]: selectedNode.data
                };
                return window.jsyaml.dump(route);
            };

            return (
                <div className="w-80 bg-slate-900 border-l border-slate-800 flex flex-col h-full overflow-hidden shrink-0">
                    <div className="flex border-b border-slate-800">
                        <button 
                            onClick={() => setActiveTab('config')}
                            className={`flex-1 py-3 text-[10px] font-bold uppercase tracking-widest border-b-2 transition-all ${
                                activeTab === 'config' ? 'border-blue-500 text-blue-400 bg-blue-500/5' : 'border-transparent text-slate-500 hover:text-slate-300'
                            }`}
                        >
                            Configuration
                        </button>
                        <button 
                            onClick={() => setActiveTab('yaml')}
                            className={`flex-1 py-3 text-[10px] font-bold uppercase tracking-widest border-b-2 transition-all ${
                                activeTab === 'yaml' ? 'border-blue-500 text-blue-400 bg-blue-500/5' : 'border-transparent text-slate-500 hover:text-slate-300'
                            }`}
                        >
                            YAML DSL
                        </button>
                    </div>
                    
                    <div className="flex-1 overflow-y-auto p-4 space-y-6">
                        {activeTab === 'config' ? (
                            <div className="space-y-6 animate-in fade-in duration-300">
                                <div>
                                    <label className="text-[10px] font-bold uppercase text-slate-500 block mb-2 tracking-widest">Node ID</label>
                                    <div className="p-3 bg-slate-950 border border-slate-800 rounded-lg text-xs font-mono text-slate-400">
                                        {selectedNode.id}
                                    </div>
                                </div>

                                <div>
                                    <label className="text-[10px] font-bold uppercase text-slate-500 block mb-2 tracking-widest">Display Label</label>
                                    <input 
                                        type="text" 
                                        className="w-full bg-slate-850 border border-slate-700 rounded-md py-2 px-3 text-sm focus:ring-1 focus:ring-blue-500 outline-none"
                                        value={selectedNode.label}
                                        onChange={e => updateNode(selectedNode.id, { label: e.target.value }, true)}
                                    />
                                </div>

                                {selectedNode.data?.uri !== undefined && (
                                    <div>
                                        <label className="text-[10px] font-bold uppercase text-slate-500 block mb-2 tracking-widest">URI Endpoint</label>
                                        <input 
                                            type="text" 
                                            className="w-full bg-slate-850 border border-slate-700 rounded-md py-2 px-3 text-sm font-mono focus:ring-1 focus:ring-blue-500 outline-none"
                                            value={selectedNode.data.uri}
                                            onChange={e => updateNode(selectedNode.id, { uri: e.target.value })}
                                        />
                                        <p className="mt-1 text-[9px] text-slate-600">e.g. log:info, timer:tick?period=1000</p>
                                    </div>
                                )}

                                {selectedNode.data?.expression && Object.keys(selectedNode.data.expression).map(lang => (
                                    <div key={lang}>
                                        <label className="text-[10px] font-bold uppercase text-slate-500 block mb-2 tracking-widest">Expression ({lang})</label>
                                        <textarea 
                                            className="w-full bg-slate-850 border border-slate-700 rounded-md py-2 px-3 text-sm font-mono focus:ring-1 focus:ring-blue-500 outline-none h-24 resize-none"
                                            value={selectedNode.data.expression[lang]}
                                            onChange={e => {
                                                const newExpr = { ...selectedNode.data.expression, [lang]: e.target.value };
                                                updateNode(selectedNode.id, { expression: newExpr });
                                            }}
                                        />
                                    </div>
                                ))}

                                {selectedNode.description && (
                                    <div className="bg-slate-800/30 p-3 rounded border border-slate-700/50">
                                        <p className="text-[10px] text-slate-500 italic leading-relaxed">
                                            {selectedNode.description}
                                        </p>
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div className="h-full flex flex-col animate-in fade-in duration-300">
                                <div className="flex justify-between items-center mb-2">
                                    <span className="text-[10px] font-bold text-slate-500 uppercase">Live Preview</span>
                                    <button onClick={() => navigator.clipboard.writeText(generateYaml())} className="text-blue-400 hover:text-blue-300 text-[10px] font-bold">COPY</button>
                                </div>
                                <pre className="flex-1 p-3 bg-slate-950 border border-slate-800 rounded-lg text-[10px] font-mono text-emerald-400 overflow-auto scrollbar-hide">
                                    {generateYaml()}
                                </pre>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [search, setSearch] = useState('');
            const [nodes, setNodes] = useState([]);
            const [selectedNode, setSelectedNode] = useState(null);

            const updateNode = (id, newData, isMeta = false) => {
                setNodes(prev => prev.map(n => {
                    if (n.id === id) {
                        if (isMeta) return { ...n, ...newData };
                        return { ...n, data: { ...n.data, ...newData } };
                    }
                    return n;
                }));
                
                // Update selection state as well
                setSelectedNode(prev => {
                    if (prev?.id === id) {
                        if (isMeta) return { ...prev, ...newData };
                        return { ...prev, data: { ...prev.data, ...newData } };
                    }
                    return prev;
                });
            };

            const downloadYAML = () => {
                if (nodes.length === 0) {
                    alert("Canvas is empty!");
                    return;
                }
                const route = {
                    route: {
                        from: {
                            uri: nodes.find(n => n.type === 'source')?.data?.uri || 'timer:tick',
                            steps: nodes.filter(n => n.type !== 'source').map(n => {
                                // Simplify for demo purposes
                                if (n.data?.uri) return { to: n.data.uri };
                                return { [n.id]: n.data };
                            })
                        }
                    }
                };
                const blob = new Blob([window.jsyaml.dump(route)], { type: 'text/yaml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'route.camel.yaml';
                a.click();
            };

            const clearCanvas = () => {
                if (confirm("Clear all nodes?")) {
                    setNodes([]);
                    setSelectedNode(null);
                }
            };

            return (
                <div className="flex flex-col h-screen overflow-hidden">
                    <header className="h-14 border-b border-slate-800 bg-slate-900 flex items-center justify-between px-6 z-40 shadow-xl shrink-0">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600 p-1.5 rounded-lg shadow-lg shadow-blue-500/20">
                                <Icon name="route" className="w-5 h-5 text-white" />
                            </div>
                            <div>
                                <h1 className="text-sm font-bold tracking-tight text-white">Tessera Visual Designer</h1>
                                <p className="text-[10px] text-slate-500 font-medium uppercase tracking-widest flex items-center gap-1.5">
                                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                                    Portable Edition • Chapter 17
                                </p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={clearCanvas} className="flex items-center gap-2 px-3 py-1.5 hover:bg-red-500/10 hover:text-red-400 border border-transparent rounded-md text-xs font-semibold transition-all text-slate-500">
                                <Icon name="trash-2" className="w-3.5 h-3.5" />
                                Clear
                            </button>
                            <button onClick={downloadYAML} className="flex items-center gap-2 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-md text-xs font-semibold transition-all">
                                <Icon name="download" className="w-3.5 h-3.5" />
                                Export YAML
                            </button>
                            <button className="flex items-center gap-2 px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-md text-xs font-bold shadow-lg shadow-blue-500/20 transition-all">
                                <Icon name="play" className="w-3.5 h-3.5 fill-current" />
                                Run Route
                            </button>
                        </div>
                    </header>
                    <div className="flex-1 flex overflow-hidden">
                        <Palette search={search} setSearch={setSearch} />
                        <Canvas nodes={nodes} setNodes={setNodes} selectedNode={selectedNode} setSelectedNode={setSelectedNode} />
                        <Properties selectedNode={selectedNode} updateNode={updateNode} />
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
