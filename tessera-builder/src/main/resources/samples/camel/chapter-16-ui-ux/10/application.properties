# Quarkus and Camel Application Properties
quarkus.http.port=9090
quarkus.log.level=INFO

# Embedded H2 Database Configuration
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:integration_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# Camel Configuration
camel.context.name=modular-integration-chassis
camel.main.routes-include-pattern=10-enterprise-chassis.camel.yaml

# Stubbing & Simulation Flags
chassis.stubs.kafka.enabled=true
chassis.stubs.ibmmq.enabled=true
chassis.stubs.smtp.enabled=true
