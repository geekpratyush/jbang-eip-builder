# ID: live-flow-debugger
# DESCRIPTION: Serves the Live Flow Debugger UI prototype.
# camel-k: dependency=mvn:org.apache.camel:camel-sql:4.18.0
# camel-k: dependency=mvn:org.apache.camel:camel-jackson:4.18.0

- route:
    id: "ui-02-debugger-init"
    from:
      uri: "timer:init-02-3?repeatCount=1&delay=1000"
      steps:
        - to: "sql:CREATE TABLE IF NOT EXISTS ui_features (id VARCHAR(50) PRIMARY KEY, title VARCHAR(100), endpoint VARCHAR(100), type VARCHAR(50), icon VARCHAR(50))"
        - to: "sql:MERGE INTO ui_features (id, title, endpoint, type, icon) KEY(id) VALUES ('debugger', 'Live Flow Debugger', '/02/debugger', 'UI', 'fas fa-bug')"
        - log: "Module 02 - Live Flow Debugger registered."

- rest:
    get:
      - path: "/02/debugger"
        produces: "text/html"
        to: "direct:serve-02-debugger"

- route:
    id: "ui-serve-02-debugger"
    from:
      uri: "direct:serve-02-debugger"
      steps:
        - setBody:
            constant: "resource:file:{{WORKSPACE_ROOT_DIR}}/assets/chapter-16-ui-ux/01/ui/01-6-live-flow-debugger.html"
        - convertBodyTo: "java.lang.String"
        - setHeader:
            name: "Content-Type"
            constant: "text/html"
