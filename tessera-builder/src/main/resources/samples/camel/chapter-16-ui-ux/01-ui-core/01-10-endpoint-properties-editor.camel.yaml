# ID: endpoint-properties-editor
# DESCRIPTION: Tabbed UI for complex AMQP, REST, and File properties.
# camel-k: dependency=mvn:org.apache.camel:camel-sql:4.18.0
# camel-k: dependency=mvn:org.apache.camel:camel-jackson:4.18.0

- route:
    id: "ui-04-endpoint-init"
    from:
      uri: "timer:init-04-1?repeatCount=1"
      steps:
        - to: "sql:CREATE TABLE IF NOT EXISTS ui_features (id VARCHAR(50) PRIMARY KEY, title VARCHAR(100), endpoint VARCHAR(100), type VARCHAR(50), icon VARCHAR(50))"
        - to: "sql:MERGE INTO ui_features (id, title, endpoint, type, icon) KEY(id) VALUES ('endpoint', 'Endpoint Properties Editor', '/04/endpoint', 'UI', 'fas fa-sliders-h')"

- rest:
    get:
      - path: "/04/endpoint"
        produces: "text/html"
        to: "direct:serve-04-endpoint"

- route:
    id: "ui-serve-04-endpoint"
    from:
      uri: "direct:serve-04-endpoint"
      steps:
        - setBody:
            constant: "resource:file:{{WORKSPACE_ROOT_DIR}}/assets/chapter-16-ui-ux/01-ui-core/ui/01-10-endpoint-properties-editor.html"
        - convertBodyTo: "java.lang.String"
        - setHeader:
            name: "Content-Type"
            constant: "text/html"
