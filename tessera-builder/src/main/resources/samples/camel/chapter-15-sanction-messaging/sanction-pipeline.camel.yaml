# camel-k: dependency=mvn:org.apache.camel:camel-joor:4.18.0
# camel-k: dependency=mvn:org.apache.camel:camel-xslt-saxon:4.18.0
# camel-k: dependency=mvn:org.apache.camel:camel-groovy:4.18.0
# camel-k: dependency=mvn:com.tessera:tessera-faker:1.0.0-SNAPSHOT

- beans:
    - name: "sanctionFaker"
      type: "com.tessera.faker.UniversalFaker"
      properties:
        templatesDir: "FAKER/templates/sanctions"
        dbDir: "FAKER/faker-db/financial"

- route:
    id: sanction-xslt-pipeline
    from:
      uri: "timer:sanction-xslt-trigger?period=5000"
      steps:
        - setHeader:
            name: "e2eStartTime"
            groovy: "System.nanoTime()"
        
        # --- Source: Faker Engine ---
        - bean:
            ref: "sanctionFaker"
            method: "generate('sanctions')"
        - log: "Faker Generated Message Received"
        
        # --- Step 1: Strip Header (Pattern Demo) ---
        - to: "direct:strip-sanction-metadata"
        
        # --- Step 2: Transform Body (Using workspace XSLT) ---
        - setHeader:
            name: "transStartTime"
            groovy: "System.nanoTime()"
        - to: "direct:ccio-to-iso-xslt"
        - setHeader:
            name: "transDuration"
            groovy: |
              return String.format('%.3f', (System.nanoTime() - headers.transStartTime) / 1000000.0)
        
        # --- Step 3: Reattach Header (Pattern Demo) ---
        - to: "direct:reattach-sanction-metadata"
        
        - setHeader:
            name: "e2eDuration"
            groovy: |
              return String.format('%.3f', (System.nanoTime() - headers.e2eStartTime) / 1000000.0)
        
        - log: "Sanction Processing Stats (XSLT): Translation: ${header.transDuration}ms, End-to-End: ${header.e2eDuration}ms"
        - log: "Final Processed Message:\n${body}"

- route:
    id: strip-sanction-metadata
    from:
      uri: "direct:strip-sanction-metadata"
      steps:
        - setHeader:
            name: "SanctionHeader"
            groovy: |
              def m = (body =~ /(?s)\[HEADER_START\].*?\[HEADER_END\]/)
              return m ? m[0] : ""
        - setBody:
            groovy: |
              return body.replaceAll(/(?s)\[HEADER_START\].*?\[HEADER_END\]\s*/, '')

- route:
    id: ccio-to-iso-xslt
    from:
      uri: "direct:ccio-to-iso-xslt"
      steps:
        # Re-assemble for the CCIO XSLT which expects a full 'payload' parameter
        - setHeader:
            name: "payload"
            groovy: |
              return headers.SanctionHeader + "\n" + body
        
        # Clean & Simple XSLT 3.0 call pointing to workspace resource
        - to: "xslt-saxon:file://{{WORKSPACE_ROOT_DIR}}/mappings/xslt-3.0/ccio-to-iso/transform.xslt?contentCache=true"
        
        # Strip the header produced by the XSLT to respect the Camel reattach pattern
        - setBody:
            groovy: |
              return body.replaceAll(/(?s)\[HEADER_START\].*?\[HEADER_END\]\s*/, '')

- route:
    id: reattach-sanction-metadata
    from:
      uri: "direct:reattach-sanction-metadata"
      steps:
        - setBody:
            groovy: |
              return (headers['SanctionHeader'] ?: "") + "\n" + body
