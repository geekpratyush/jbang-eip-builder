# ID: 11-04-event-streaming
# TITLE: Event Streaming Control Plane
# DESCRIPTION: A dashboard for managing and monitoring event-driven architectures, tracking message queues, dead-letter topics, and system latency.
# camel-k: dependency=mvn:org.apache.camel:camel-sql:4.18.0
# camel-k: dependency=mvn:org.apache.camel:camel-jackson:4.18.0

- route:
    id: "11-04-event-streaming-init"
    from:
      uri: "timer:init?repeatCount=1"
      steps:
        - to: "sql:CREATE TABLE IF NOT EXISTS ui_features (id VARCHAR(50) PRIMARY KEY, title VARCHAR(100), endpoint VARCHAR(100), type VARCHAR(50), icon VARCHAR(50))"
        - to: "sql:MERGE INTO ui_features (id, title, endpoint, type, icon) KEY(id) VALUES ('11-04-event-streaming', 'Event Streaming Control Plane', '/api/telemetry', 'CHART', 'fas fa-chart-area')"
        - log: "[Plugin Activated] Event Streaming Control Plane registered inside Core Dashboard"

- route:
    id: "11-04-event-streaming-ui"
    from:
      uri: "platform-http:/"
      steps:
        - setHeader:
            name: "Content-Type"
            constant: "text/html"
        - setBody:
            constant: "resource:file:{{WORKSPACE_ROOT_DIR}}/assets/chapter-16-ui-ux/11-enterprise-integration/11-04-event-streaming/ui/index.html"
        - convertBodyTo: "java.lang.String"

- route:
    id: "11-04-event-streaming-telemetry-api"
    from:
      uri: "platform-http:/api/telemetry"
      steps:
        # Returns random data for charts telemetry
        - transform:
            groovy: |
                def rand = new java.util.Random()
                def txns = []
                def load = []
                for(int i=0; i<6; i++) {
                    txns.add(rand.nextInt(30) + 5)
                    load.add(rand.nextInt(40) + 40)
                }
                return [
                    "transactions": txns,
                    "systemLoad": load
                ]
        - marshal:
            json: {}
        - setHeader:
            name: "Content-Type"
            constant: "application/json"

- route:
    id: "11-04-event-streaming-action-api"
    from:
      uri: "platform-http:/api/action"
      steps:
        - convertBodyTo: "java.lang.String"
        - log: "[Action Triggered] Received operation request: ${body}"
        - setBody:
            constant: '{ "status": "COMPLETED", "message": "Operation successfully executed by Apache Camel Integration Engine" }'
        - setHeader:
            name: "Content-Type"
            constant: "application/json"
