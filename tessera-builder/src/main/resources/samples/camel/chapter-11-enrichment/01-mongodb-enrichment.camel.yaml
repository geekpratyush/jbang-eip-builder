# ID: mongodb-enrichment
# DESCRIPTION: Query MongoDB for original pacs.008 message using MsgId and perform XSLT enrichment
# camel-k: dependency=mvn:org.apache.camel:camel-xslt-saxon:4.18.0

- route:
    id: mongodb-enrichment-route
    from:
      uri: "timer:trigger?repeatCount=1&delay=500"
      steps:
        # Step 1: Seed the database with original.xml
        - setBody:
            simple: "resource:file:chapter-11-enrichment/original.xml"
        - convertBodyTo: "java.lang.String"
        - setProperty:
            name: "originalXml"
            simple: "${body}"
        - transform:
            groovy: |
              String xml = exchange.getProperty("originalXml", String.class)
              String escaped = xml.replace("\\", "\\\\").replace("\"", "\\\"").replace("\n", "\\n").replace("\r", "\\r")
              return """{
                "_id": "MSG-pacs008-20260521-001",
                "payload": "${escaped}"
              }""".toString()
        - to: "mongodb:mongoClient?database=test&collection=pacs008&operation=save"
        - log: "Database seeded."

        # Step 2: Load truncated.xml and extract MsgId
        - setBody:
            simple: "resource:file:chapter-11-enrichment/truncated.xml"
        - convertBodyTo: "java.lang.String"
        - transform:
            groovy: |
              String body = request.getBody(String.class)
              int idx = body.indexOf("?>")
              return idx != -1 ? body.substring(idx + 2).trim() : body
        - setProperty:
            name: "truncatedXml"
            simple: "${body}"
        - setProperty:
            name: "msgId"
            xpath:
              expression: "/*[local-name()='Document']/*[local-name()='FIToFICstmrCdtTrf']/*[local-name()='GrpHdr']/*[local-name()='MsgId']/text()"
              resultType: "String"
        - log: "Extracted MsgId: ${exchangeProperty.msgId}"

        # Step 3: Query Native Embedded MongoDB
        - setBody:
            simple: "{\"_id\": \"${exchangeProperty.msgId}\"}"
        - to: "mongodb:mongoClient?database=test&collection=pacs008&operation=findOneByQuery"
        - setProperty:
            name: "originalXml"
            simple: "${body[payload]}"
        - setBody:
            simple: "${exchangeProperty.originalXml}"
        - transform:
            groovy: |
              String body = request.getBody(String.class)
              int idx = body.indexOf("?>")
              return idx != -1 ? body.substring(idx + 2).trim() : body
        - setProperty:
            name: "originalXml"
            simple: "${body}"
        - log: "Retrieved original message directly from Native MongoDB"

        # Step 4: Wrap both XMLs inside an <envelope>
        - setBody:
            simple: |
              <envelope>mongo-gateway
                <original>
                  ${exchangeProperty.originalXml}
                </original>
                <truncated>
                  ${exchangeProperty.truncatedXml}
                </truncated>
              </envelope>
        - log: "Combined Envelope XML:\n${body}"

        # Step 5: Perform XSLT enrichment
        - to: "xslt-saxon:file:chapter-11-enrichment/enrich.xslt"
        - log: "Enrichment complete!"
        - log: "Enriched Document:\n${body}"
