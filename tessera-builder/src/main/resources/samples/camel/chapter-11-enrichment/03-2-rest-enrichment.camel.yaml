# ID: rest-enrichment
# DESCRIPTION: Query the simulated REST API for original pacs.008 message and perform XSLT enrichment
# camel-k: dependency=mvn:org.apache.camel:camel-http:4.18.0
# camel-k: dependency=mvn:org.apache.camel:camel-xslt-saxon:4.18.0

- route:
    id: rest-enrichment-route
    from:
      uri: "timer:trigger?repeatCount=1&delay=2000"
      steps:
        # Step 1: Load truncated.xml and extract MsgId
        - setBody:
            simple: "resource:file:chapter-11-enrichment/truncated.xml"
        - convertBodyTo: "java.lang.String"
        - transform:
            groovy: |
              String body = request.getBody(String.class)
              int idx = body.indexOf("?>")
              return idx != -1 ? body.substring(idx + 2).trim() : body
        - setHeader:
            name: "truncatedXml"
            simple: "${body}"
        - setHeader:
            name: "msgId"
            xpath:
              expression: "/*[local-name()='Document']/*[local-name()='FIToFICstmrCdtTrf']/*[local-name()='GrpHdr']/*[local-name()='MsgId']/text()"
              resultType: "String"
        - log: "Extracted MsgId: ${header.msgId}"

        # Step 2: Query simulated REST API using the extracted MsgId
        # Using localhost:9090 which is the default port defined in application.properties
        - toD: "http://localhost:9090/api/messages/${header.msgId}?httpMethod=GET"
        - transform:
            groovy: |
              String body = request.getBody(String.class)
              int idx = body.indexOf("?>")
              return idx != -1 ? body.substring(idx + 2).trim() : body
        - setHeader:
            name: "originalXml"
            simple: "${body}"
        - log: "Retrieved original message from REST endpoint"

        # Step 3: Wrap both XMLs inside an <envelope>
        - setBody:
            simple: |
              <envelope>
                <original>
                  ${header.originalXml}
                </original>
                <truncated>
                  ${header.truncatedXml}
                </truncated>
              </envelope>

        # Step 4: Perform XSLT enrichment
        - to: "xslt-saxon:file:chapter-11-enrichment/enrich.xslt"
        - log: "Enrichment complete!"
        - log: "Enriched Document:\n${body}"
