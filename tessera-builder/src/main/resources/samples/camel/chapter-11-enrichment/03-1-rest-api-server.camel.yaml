# ID: rest-api-server
# DESCRIPTION: Mock REST API Server that serves the original pacs.008 message
# camel-k: dependency=mvn:org.apache.camel:camel-http:4.18.0

- rest:
    get:
      - path: "/api/messages/{id}"
        to: "direct:mock-rest-api"

- route:
    id: mock-rest-api-route
    from:
      uri: "direct:mock-rest-api"
      steps:
        - log: "Received REST request for Message ID: ${header.id}"
        # Hardcode returning the original XML file to simulate an actual API
        - setBody:
            simple: "resource:file:chapter-11-enrichment/original.xml"
        - convertBodyTo: "java.lang.String"
        - setHeader:
            name: "Content-Type"
            constant: "application/xml"
        - log: "Served original message via mock API"
