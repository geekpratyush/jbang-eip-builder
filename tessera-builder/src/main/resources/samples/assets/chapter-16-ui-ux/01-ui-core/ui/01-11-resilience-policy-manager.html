<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Resilience Policy Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js" defer></script>
</head>
<body class="bg-slate-900 text-slate-200 h-screen p-8" x-data="{ cb: 50, retries: 3 }">
    <h1 class="text-2xl font-bold mb-6 text-amber-400">Resilience & Stability Policies</h1>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="bg-slate-800 p-6 rounded-lg border border-slate-700">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2">🛑 Circuit Breaker</h2>
            <div class="mb-4">
                <label class="block mb-2">Failure Rate Threshold (%) - <span x-text="cb" class="text-amber-400 font-bold"></span>%</label>
                <input type="range" min="1" max="100" x-model="cb" class="w-full accent-amber-500">
            </div>
            <label class="flex items-center gap-2 mt-4 cursor-pointer">
                <input type="checkbox" class="w-5 h-5 accent-amber-500" checked>
                <span>Enable Half-Open State Transition</span>
            </label>
        </div>
        <div class="bg-slate-800 p-6 rounded-lg border border-slate-700">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2">🔄 Exponential Backoff</h2>
            <div class="mb-4">
                <label class="block mb-2">Max Redelivery Attempts - <span x-text="retries" class="text-amber-400 font-bold"></span></label>
                <input type="range" min="0" max="10" x-model="retries" class="w-full accent-amber-500">
            </div>
            <label class="block mb-4 mt-4">Multiplier <input type="number" class="w-full mt-1 bg-slate-900 border border-slate-700 p-2 rounded" value="2.0"></label>
        </div>
    </div>
</body>
</html>
