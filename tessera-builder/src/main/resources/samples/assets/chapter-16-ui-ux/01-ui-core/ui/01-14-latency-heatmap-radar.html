<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Latency Heatmap Radar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-200 h-screen p-8">
    <h1 class="text-2xl font-bold mb-6 text-orange-400">Route Latency Heatmap</h1>
    <div class="space-y-4 max-w-4xl">
        
        <div class="bg-slate-800 p-4 rounded border border-slate-700">
            <div class="flex justify-between mb-2">
                <span class="font-bold">Payments API Gateway (01-core)</span>
                <span class="text-emerald-400 font-mono">24ms</span>
            </div>
            <div class="w-full bg-slate-900 rounded-full h-4">
                <div class="bg-emerald-500 h-4 rounded-full" style="width: 15%"></div>
            </div>
        </div>

        <div class="bg-slate-800 p-4 rounded border border-slate-700">
            <div class="flex justify-between mb-2">
                <span class="font-bold">Legacy Mainframe DB Sync (04-sync)</span>
                <span class="text-red-400 font-mono animate-pulse">845ms</span>
            </div>
            <div class="w-full bg-slate-900 rounded-full h-4">
                <div class="bg-red-500 h-4 rounded-full" style="width: 95%"></div>
            </div>
        </div>

        <div class="bg-slate-800 p-4 rounded border border-slate-700">
            <div class="flex justify-between mb-2">
                <span class="font-bold">Customer Profile Enrichment (02-enrich)</span>
                <span class="text-amber-400 font-mono">180ms</span>
            </div>
            <div class="w-full bg-slate-900 rounded-full h-4">
                <div class="bg-amber-500 h-4 rounded-full" style="width: 45%"></div>
            </div>
        </div>

    </div>
</body>
</html>
