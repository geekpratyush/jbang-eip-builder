<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Visual Route Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { slate: { 850: '#151e2e' } } } } }
    </script>
    <style>body { margin: 0; padding: 0; overflow: hidden; }</style>
</head>
<body class="bg-slate-900 text-slate-200 h-screen flex flex-col">
    <header class="bg-slate-800 p-4 border-b border-slate-700 flex justify-between items-center">
        <h1 class="text-xl font-bold text-emerald-400">Visual Route Builder</h1>
        <button class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded" onclick="generateYAML()">Simulate Add Node</button>
    </header>
    <div class="flex flex-1 overflow-hidden">
        <div class="w-64 bg-slate-850 border-r border-slate-700 p-4 flex flex-col gap-4">
            <h2 class="text-slate-400 text-sm uppercase tracking-wider font-bold">Nodes</h2>
            <div class="bg-slate-800 p-3 rounded border border-slate-700 cursor-move hover:border-emerald-500">Endpoint (Timer)</div>
            <div class="bg-slate-800 p-3 rounded border border-slate-700 cursor-move hover:border-blue-500">Processor (Log)</div>
            <div class="bg-slate-800 p-3 rounded border border-slate-700 cursor-move hover:border-purple-500">Splitter</div>
        </div>
        <div class="flex-1 relative" id="editor-container"></div>
    </div>
    <!-- Monaco Editor Loader Config -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs/loader.min.js"></script>
    <script>
        let editor;
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: `- route:
    id: "generated-route"
    from:
      uri: "timer:tick"`,
                language: "yaml",
                theme: "vs-dark",
                automaticLayout: true
            });
        });
        function generateYAML() {
            if(editor) {
                const current = editor.getValue();
                editor.setValue(current + `\n      steps:\n        - log: "Tick processed!"`);
            }
        }
    </script>
</body>
</html>
