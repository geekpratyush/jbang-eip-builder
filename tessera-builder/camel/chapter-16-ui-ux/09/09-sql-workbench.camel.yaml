- route:
    id: "09-sql-workbench-init"
    from:
      uri: "timer:init-sql?repeatCount=1"
      steps:
        - log: "Initializing H2 Database with credit_earmarks table"
        - to: "sql:CREATE SCHEMA IF NOT EXISTS core"
        - to: "sql:CREATE TABLE IF NOT EXISTS core.credit_earmarks (earmark_id VARCHAR(50), counterparty VARCHAR(100), facility_id VARCHAR(50), currency VARCHAR(10), amount VARCHAR(50), status VARCHAR(50), created_at TIMESTAMP)"
        - to: "sql:DELETE FROM core.credit_earmarks"
        - to: "sql:INSERT INTO core.credit_earmarks VALUES ('EMK-8094', 'Global Industries LLC', 'FAC-992-A', 'USD', '12,500,000.00', 'PENDING_APPROVAL', CURRENT_TIMESTAMP)"
        - to: "sql:INSERT INTO core.credit_earmarks VALUES ('EMK-8095', 'Stark Logistics', 'FAC-314-B', 'EUR', '4,250,000.00', 'PENDING_APPROVAL', CURRENT_TIMESTAMP)"
        - to: "sql:INSERT INTO core.credit_earmarks VALUES ('EMK-8096', 'Oceanic Trade Corp', 'FAC-110-C', 'GBP', '1,800,000.00', 'PENDING_APPROVAL', CURRENT_TIMESTAMP)"
        - to: "sql:INSERT INTO core.credit_earmarks VALUES ('EMK-8097', 'Acme Financials', 'FAC-775-D', 'USD', '8,900,000.00', 'PENDING_APPROVAL', CURRENT_TIMESTAMP)"
        - to: "sql:INSERT INTO core.credit_earmarks VALUES ('EMK-7011', 'Wayne Enterprises', 'FAC-100-A', 'USD', '95,000,000.00', 'APPROVED', CURRENT_TIMESTAMP)"
        - to: "sql:INSERT INTO core.credit_earmarks VALUES ('EMK-7012', 'LexCorp', 'FAC-200-X', 'USD', '45,200,000.00', 'REJECTED', CURRENT_TIMESTAMP)"

- route:
    id: "09-sql-workbench-ui"
    from:
      uri: "platform-http:/09/sql-workbench"
      steps:
        - setHeader:
            name: "Content-Type"
            constant: "text/html"
        - setBody:
            constant: "resource:file:{{WORKSPACE_ROOT_DIR}}/assets/chapter-16-ui-ux/09/ui/index.html"
        - convertBodyTo: "java.lang.String"
        - log: "Serving SQL Workbench UI"

- route:
    id: "09-sql-workbench-api"
    from:
      uri: "platform-http:/09/api/execute"
      steps:
        - convertBodyTo: "java.lang.String"
        - toD: "sql:${body}"
        - marshal:
            json: {}
        - setHeader:
            name: "Content-Type"
            constant: "application/json"
