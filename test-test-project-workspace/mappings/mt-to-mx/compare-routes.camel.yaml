# camel-k: dependency=mvn:org.apache.camel:camel-xslt-saxon:4.18.0
# camel-k: dependency=mvn:org.apache.camel:camel-joor:4.18.0
# camel-k: dependency=mvn:org.apache.camel:camel-swift:4.18.2
# camel-k: dependency=mvn:org.apache.camel:camel-groovy:4.18.0

- route:
    id: compare-mt-to-mx
    from:
      uri: "timer:trigger?repeatCount=1"
      steps:
        - setBody:
            simple: "resource:file://{{WORKSPACE_ROOT_DIR}}/mappings/mt-to-mx/CBPR-MT103-to-PACS008/source.txt"
        - setHeader:
            name: "rawMT"
            simple: "${body}"
        
        # 1. JOOR Transformation
        - to: "direct:run-joor"
        - setHeader:
            name: "joorOutput"
            simple: "${body}"
        
        # 2. XSLT Transformation
        - setBody:
            header: "rawMT"
        - to: "direct:run-xslt"
        - setHeader:
            name: "xsltOutput"
            simple: "${body}"
        
        # 3. Log and Compare
        - log: "JOOR Output: ${header.joorOutput}"
        - log: "XSLT Output: ${header.xsltOutput}"
        - script:
            groovy: |
              def joor = exchange.in.headers.joorOutput
              def xslt = exchange.in.headers.xsltOutput
              // Basic normalization for comparison (ignoring whitespace and dynamic CreDtTm)
              def clean = { s -> s.replaceAll(/>\s+</, '><').replaceAll(/<CreDtTm>.*?<\/CreDtTm>/, '<CreDtTm>TIMESTAMP</CreDtTm>').trim() }
              if (clean(joor) == clean(xslt)) {
                  log.info('SUCCESS: JOOR and XSLT outputs match!')
              } else {
                  log.error('FAILURE: JOOR and XSLT outputs DO NOT match!')
              }

- route:
    id: run-joor
    from:
      uri: "direct:run-joor"
      steps:
        - transform:
            joor: "resource:file://{{WORKSPACE_ROOT_DIR}}/mappings/mt-to-mx/MT103-TO-PACS008-JOOR/Transform.java"

- route:
    id: run-xslt
    from:
      uri: "direct:run-xslt"
      steps:
        - unmarshal:
            swiftMt: {}
        - setBody:
            simple: "${body.xml}"
        - to:
            uri: "xslt-saxon:file://{{WORKSPACE_ROOT_DIR}}/mappings/mt-to-mx/CBPR-MT103-to-PACS008/transform.xslt?contentCache=true"
