# ID: 16-03-omnichannel-support
# TITLE: Omnichannel Support Command Center
# DESCRIPTION: A unified inbox for customer support agents that aggregates email, chat, and phone interactions, augmented by AI suggested responses.
# camel-k: dependency=mvn:org.apache.camel:camel-sql:4.18.0
# camel-k: dependency=mvn:org.apache.camel:camel-jackson:4.18.0

- route:
    id: "16-03-omnichannel-support-init"
    from:
      uri: "timer:init?repeatCount=1"
      steps:
        - to: "sql:CREATE TABLE IF NOT EXISTS ui_features (id VARCHAR(50) PRIMARY KEY, title VARCHAR(100), endpoint VARCHAR(100), type VARCHAR(50), icon VARCHAR(50))"
        - to: "sql:MERGE INTO ui_features (id, title, endpoint, type, icon) KEY(id) VALUES ('16-03-omnichannel-support', 'Omnichannel Support Command Center', '/api/telemetry', 'CHART', 'fas fa-headset')"
        - log: "[Plugin Activated] Omnichannel Support Command Center registered inside Core Dashboard"

- route:
    id: "16-03-omnichannel-support-ui"
    from:
      uri: "platform-http:/"
      steps:
        - setHeader:
            name: "Content-Type"
            constant: "text/html"
        - setBody:
            constant: "resource:file:{{WORKSPACE_ROOT_DIR}}/assets/chapter-16-ui-ux/16-customer-services/16-03-omnichannel-support/ui/index.html"
        - convertBodyTo: "java.lang.String"

- route:
    id: "16-03-omnichannel-support-telemetry-api"
    from:
      uri: "platform-http:/api/telemetry"
      steps:
        # Returns random data for charts telemetry
        - transform:
            groovy: |
                def rand = new java.util.Random()
                def txns = []
                def load = []
                for(int i=0; i<6; i++) {
                    txns.add(rand.nextInt(30) + 5)
                    load.add(rand.nextInt(40) + 40)
                }
                return [
                    "transactions": txns,
                    "systemLoad": load
                ]
        - marshal:
            json: {}
        - setHeader:
            name: "Content-Type"
            constant: "application/json"

- route:
    id: "16-03-omnichannel-support-action-api"
    from:
      uri: "platform-http:/api/action"
      steps:
        - convertBodyTo: "java.lang.String"
        - log: "[Action Triggered] Received operation request: ${body}"
        - setBody:
            constant: '{ "status": "COMPLETED", "message": "Operation successfully executed by Apache Camel Integration Engine" }'
        - setHeader:
            name: "Content-Type"
            constant: "application/json"
