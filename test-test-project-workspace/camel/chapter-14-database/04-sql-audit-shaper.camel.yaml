# ID: sql-audit-shaper
# DESCRIPTION: Fetch data from H2 SQL and process it through the Tessera Audit Shaper
# camel-k: dependency=mvn:org.apache.camel:camel-sql:4.18.0
# camel-k: dependency=mvn:com.tessera:tessera-audit-shaper:1.0.0-SNAPSHOT

- beans:
    - name: "auditProcessor"
      type: "com.tessera.audit.AuditShaperProcessor"

- route:
    id: "sql-audit-shaping-route"
    from:
      uri: "timer:sql-audit-shaper?repeatCount=1&delay=4000"
      steps:
        - log: "1. Provisioning SQL data..."
        - to: "sql:CREATE TABLE IF NOT EXISTS customer_data (id VARCHAR(50) PRIMARY KEY, fullname VARCHAR(100), ssn VARCHAR(20), password_hash VARCHAR(100))"
        - to: "sql:INSERT INTO customer_data (id, fullname, ssn, password_hash) VALUES ('CUST-991', 'John Smith', '123-45-6789', 'bcrypt$2a$10$xyz')"
        - log: "Inserted sensitive customer record into SQL Database."

        # Query the data back
        - to: "sql:SELECT * FROM customer_data WHERE id = 'CUST-991'"
        
        # The result from SQL is a List of Maps. Pass it through Audit Shaper
        - log: "2. Fetched raw data from SQL. Applying Tessera Audit Shaper..."
        - setHeader:
            name: "CamelAuditPrettyPrint"
            constant: "true"
        - setHeader:
            name: "CamelAuditIncludeFields"
            constant: "id, fullname, ssn" # Strip out password_hash explicitly
        - process:
            ref: "auditProcessor"
            
        - log: "3. Secured Audit Record (SSN automatically masked):\n${body}"
