# camel-k: dependency=mvn:org.apache.camel:camel-joor:4.18.0
# camel-k: dependency=mvn:org.apache.camel:camel-groovy:4.18.0
# camel-k: dependency=mvn:com.tessera:tessera-faker:1.0.0-SNAPSHOT

- beans:
    - name: "sanctionFaker"
      type: "com.tessera.faker.UniversalFaker"
      properties:
        templatesDir: "FAKER/templates/sanctions"
        dbDir: "FAKER/faker-db/financial"

- route:
    id: sanction-joor-file-pipeline
    from:
      uri: "timer:sanction-file-trigger?period=5000"
      steps:
        - setHeader:
            name: "e2eStartTime"
            groovy: "System.nanoTime()"
        
        # --- Source: Faker Engine ---
        - bean:
            ref: "sanctionFaker"
            method: "generate('sanctions')"
        - log: "Faker Generated Message Received"
        
        # --- Step 1: Strip Header (Metadata Extraction) ---
        # Note: Even though the jOOR file can strip it, we follow the Strip/Transform/Reattach pattern here
        - to: "direct:strip-metadata"
        
        # --- Step 2: Transform Body (Using external jOOR file) ---
        - setHeader:
            name: "transStartTime"
            groovy: "System.nanoTime()"
        - to: "direct:ccio-to-iso-file"
        - setHeader:
            name: "transDuration"
            groovy: |
              return String.format('%.3f', (System.nanoTime() - headers.transStartTime) / 1000000.0)
        
        # --- Step 3: Reattach Header ---
        - to: "direct:reattach-metadata"
        
        - setHeader:
            name: "e2eDuration"
            groovy: |
              return String.format('%.3f', (System.nanoTime() - headers.e2eStartTime) / 1000000.0)
        
        - log: "Sanction Processing Stats (External jOOR): Translation: ${header.transDuration}ms, End-to-End: ${header.e2eDuration}ms"
        - log: "Final Processed Message:\n${body}"

- route:
    id: strip-metadata
    from:
      uri: "direct:strip-metadata"
      steps:
        - setHeader:
            name: "SanctionHeader"
            groovy: |
              def m = (body =~ /(?s)\[HEADER_START\].*?\[HEADER_END\]/)
              return m ? m[0] : ""
        - setBody:
            groovy: |
              return body.replaceAll(/(?s)\[HEADER_START\].*?\[HEADER_END\]\s*/, '')

- route:
    id: ccio-to-iso-file
    from:
      uri: "direct:ccio-to-iso-file"
      steps:
        # We need to re-assemble the input for the jOOR file because it expects the header to be present
        # according to its internal logic (finds HEADER_START).
        - setBody:
            groovy: |
              return headers.SanctionHeader + "\n" + body
        - transform:
            joor: "resource:file://{{WORKSPACE_ROOT_DIR}}/mappings/joor-java-mapper/ccio-to-iso/Transform.java"
        # Since the jOOR file already reattaches the header, the output of this step is the full message.
        # To strictly follow the reattach pattern, we will strip it again so the next step reattaches it.
        # Actually, it's better to just let the jOOR file do its job.
        - setBody:
            groovy: |
              return body.replaceAll(/(?s)\[HEADER_START\].*?\[HEADER_END\]\s*/, '')

- route:
    id: reattach-metadata
    from:
      uri: "direct:reattach-metadata"
      steps:
        - setBody:
            groovy: |
              return (headers['SanctionHeader'] ?: "") + "\n" + body
