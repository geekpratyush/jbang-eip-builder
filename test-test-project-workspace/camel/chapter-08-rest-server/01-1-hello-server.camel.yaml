# ID: platform-http-hello
# ENABLED: true
# DESCRIPTION: Simplest live HTTP endpoint using platform-http component.
#   Starts a real server on port 9999. Run this file then call:
#     curl http://localhost:9090/hello
#     curl "http://localhost:9090/hello?name=Pratyush"
# AUTHOR: Camel Studio
# STUB: none — live HTTP server

- rest:
    get:
      - path: "/"
        produces: "text/html"
        to: "direct:serve-ch08-index"

- route:
    id: "http-hello"
    from:
      uri: "platform-http:/hello"
      parameters:
        httpMethodRestrict: "GET"
      steps:
        - to: "direct:process-hello"

- route:
    id: "serve-ch08-index"
    from:
      uri: "direct:serve-ch08-index"
      steps:
        - setBody:
            constant: |
              <html>
                <head>
                  <title>Tessera Ch 08 Index</title>
                  <style>
                    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; background: #1e1e1e; color: #d4d4d4; }
                    .card { background: #252526; padding: 30px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); max-width: 800px; margin: auto; border: 1px solid #404040; }
                    h1 { color: #4fc3f7; border-bottom: 1px solid #404040; padding-bottom: 10px; }
                    ul { line-height: 2.2; list-style: none; padding: 0; }
                    li { margin-bottom: 10px; }
                    a { color: #ce9178; text-decoration: none; font-weight: bold; }
                    a:hover { color: #dcdcaa; text-decoration: underline; }
                    .tag { font-family: monospace; font-size: 0.9em; background: #3c3c3c; padding: 3px 8px; border-radius: 4px; color: #9cdcfe; margin-right: 15px; display: inline-block; width: 40px; text-align: center; }
                    .desc { color: #909090; font-size: 0.9em; margin-left: 10px; }
                  </style>
                </head>
                <body>
                  <div class="card">
                    <h1>Tessera REST Server Index</h1>
                    <p>The following endpoints are currently active:</p>
                    <ul>
                      <li><span class="tag">GET</span> <a href="/hello">/hello</a> <span class="desc">Hello World Service</span></li>
                      <li><span class="tag">GET</span> <a href="/api/orders">/api/orders</a> <span class="desc">Order CRUD API (JSON)</span></li>
                      <li><span class="tag">GET</span> <a href="/gateway/products">/gateway/products</a> <span class="desc">API Gateway Proxy Handler</span></li>
                      <li><span class="tag">GET</span> <a href="/sse/events">/sse/events</a> <span class="desc">Server-Sent Events Stream</span></li>
                      <li><span class="tag">GET</span> <a href="/health">/health</a> <span class="desc">System Health & Metrics</span></li>
                    </ul>
                    <hr style="border: 0; border-top: 1px solid #404040; margin: 20px 0;"/>
                    <p style="text-align: right;"><small>Powered by Apache Camel 4.18.0 & Tessera Studio</small></p>
                  </div>
                </body>
              </html>
        - setHeader:
            name: "Content-Type"
            constant: "text/html"

- route:
    id: "process-hello"
    from:
      uri: "direct:process-hello"
      steps:
        - setBody:
            simple: "Hello, ${header.name}! Welcome to Camel REST on Camel Main."
        - log: "[Chapter 8][HELLO] Served: ${body}"
        - setHeader:
            name: "Content-Type"
            constant: "text/plain"


