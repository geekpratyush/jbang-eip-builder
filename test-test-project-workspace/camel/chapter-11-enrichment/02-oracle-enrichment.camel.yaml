# TYPE: ORACLE
# ID: oracle-enrichment
# DESCRIPTION: Query Oracle (H2) Database for original pacs.008 message using MsgId and perform XSLT enrichment
# camel-k: dependency=mvn:org.apache.camel:camel-xslt-saxon:4.18.0

- route:
    id: oracle-enrichment-route
    from:
      uri: "timer:trigger?repeatCount=1&delay=500"
      steps:
        # Step 0: Initialize Native SQL Table
        - to: "sql:CREATE TABLE IF NOT EXISTS pacs008 (id VARCHAR(255) PRIMARY KEY, payload CLOB)?dataSource=#dataSource"

        # Step 1: Seed the database with original.xml
        - setBody:
            constant: "resource:file:{{ch11.02.assets}}/original.xml"
        - convertBodyTo: "java.lang.String"
        - setHeader:
            name: "id"
            constant: "MSG-pacs008-20260521-001"
        - setHeader:
            name: "payload"
            simple: "${body}"
        - to: "sql:MERGE INTO pacs008 (id, payload) KEY(id) VALUES (:#id, :#payload)?dataSource=#dataSource"
        - log: "Native SQL Database seeded for ID: MSG-pacs008-20260521-001"

        # Step 2: Load truncated.xml and extract MsgId
        - setBody:
            constant: "resource:file:{{ch11.02.assets}}/truncated.xml"
        - convertBodyTo: "java.lang.String"
        - transform:
            groovy: |
              String body = request.getBody(String.class)
              int idx = body.indexOf("?>")
              return idx != -1 ? body.substring(idx + 2).trim() : body
        - setHeader:
            name: "truncatedXml"
            simple: "${body}"
        - setHeader:
            name: "msgId"
            xpath:
              expression: "/*[local-name()='Document']/*[local-name()='FIToFICstmrCdtTrf']/*[local-name()='GrpHdr']/*[local-name()='MsgId']/text()"
              resultType: "String"
        - log: "Extracted MsgId: ${header.msgId}"

        # Step 3: Query Native SQL Database
        - to: "sql:SELECT payload FROM pacs008 WHERE id = :#msgId?dataSource=#dataSource&outputType=SelectOne"
        - setHeader:
            name: "originalXml"
            simple: "${body}"
        - setBody:
            simple: "${header.originalXml}"
        - transform:
            groovy: |
              String body = request.getBody(String.class)
              if (body == null) return ""
              int idx = body.indexOf("?>")
              return idx != -1 ? body.substring(idx + 2).trim() : body
        - setHeader:
            name: "originalXml"
            simple: "${body}"
        - log: "Retrieved original message from Native SQL DB"

        # Step 4: Wrap both XMLs inside an <envelope>
        - setBody:
            simple: |
              <envelope>
                <original>
                  ${header.originalXml}
                </original>
                <truncated>
                  ${header.truncatedXml}
                </truncated>
              </envelope>

        # Step 5: Perform XSLT enrichment
        - to: "xslt-saxon:file:{{ch11.02.assets}}/enrich.xslt"
        - log: "Enrichment complete!"
        - log: "Enriched Document:\n${body}"
