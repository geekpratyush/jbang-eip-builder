<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Realtime TPS Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-200 h-screen flex flex-col p-8">
    <h1 class="text-2xl font-bold mb-6 text-fuchsia-400">Sovereign Telemetry: Realtime TPS</h1>
    <div class="grid grid-cols-2 gap-6 mb-6">
        <div class="bg-slate-800 p-6 rounded-lg border border-slate-700 flex flex-col justify-center items-center">
            <div class="text-slate-400 uppercase tracking-widest text-xs font-bold mb-2">Peak TPS</div>
            <div class="text-5xl font-black text-fuchsia-400">4,208</div>
        </div>
        <div class="bg-slate-800 p-6 rounded-lg border border-slate-700 flex flex-col justify-center items-center">
            <div class="text-slate-400 uppercase tracking-widest text-xs font-bold mb-2">Active Threads</div>
            <div class="text-5xl font-black text-emerald-400">128</div>
        </div>
    </div>
    <div class="flex-1 bg-slate-800 p-4 rounded-lg border border-slate-700 relative">
        <canvas id="tpsChart"></canvas>
    </div>
    <script>
        const ctx = document.getElementById('tpsChart').getContext('2d');
        const data = Array.from({length: 20}, () => Math.floor(Math.random() * 500 + 3000));
        const labels = Array.from({length: 20}, (_, i) => i + 's');
        
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Transactions Per Second',
                    data: data,
                    borderColor: '#c026d3',
                    backgroundColor: 'rgba(192, 38, 211, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                    x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                },
                plugins: { legend: { labels: { color: '#f8fafc' } } },
                animation: { duration: 0 }
            }
        });
        
        setInterval(() => {
            chart.data.datasets[0].data.push(Math.floor(Math.random() * 500 + 3000));
            chart.data.datasets[0].data.shift();
            chart.update();
        }, 1000);
    </script>
</body>
</html>
