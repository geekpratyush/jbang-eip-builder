<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Endpoint Properties Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js" defer></script>
</head>
<body class="bg-slate-900 text-slate-200 h-screen p-8" x-data="{ tab: 'amqp' }">
    <h1 class="text-2xl font-bold mb-6 text-blue-400">Endpoint Properties Editor</h1>
    <div class="flex border-b border-slate-700 mb-6">
        <button class="px-4 py-2 font-bold" :class="tab === 'amqp' ? 'text-blue-400 border-b-2 border-blue-400' : 'text-slate-400'" @click="tab = 'amqp'">AMQP 1.0</button>
        <button class="px-4 py-2 font-bold" :class="tab === 'rest' ? 'text-blue-400 border-b-2 border-blue-400' : 'text-slate-400'" @click="tab = 'rest'">REST / HTTP</button>
        <button class="px-4 py-2 font-bold" :class="tab === 'file' ? 'text-blue-400 border-b-2 border-blue-400' : 'text-slate-400'" @click="tab = 'file'">File / FTP</button>
    </div>
    <div class="bg-slate-800 p-6 rounded-lg border border-slate-700 max-w-3xl">
        <div x-show="tab === 'amqp'" class="flex flex-col gap-4">
            <label>Broker URI <input type="text" class="w-full mt-1 bg-slate-900 border border-slate-700 p-2 rounded" value="amqps://broker.enterprise.internal:5671"></label>
            <label>Queue Name <input type="text" class="w-full mt-1 bg-slate-900 border border-slate-700 p-2 rounded" value="audit.logs.tx"></label>
            <label>Concurrent Consumers <input type="number" class="w-full mt-1 bg-slate-900 border border-slate-700 p-2 rounded" value="5"></label>
        </div>
        <div x-show="tab === 'rest'" class="flex flex-col gap-4" style="display:none;">
            <label>Base URL <input type="text" class="w-full mt-1 bg-slate-900 border border-slate-700 p-2 rounded" value="https://api.partner.com/v1"></label>
            <label>OAuth Token Endpoint <input type="text" class="w-full mt-1 bg-slate-900 border border-slate-700 p-2 rounded" value="https://auth.partner.com/token"></label>
            <label>Timeout (ms) <input type="number" class="w-full mt-1 bg-slate-900 border border-slate-700 p-2 rounded" value="5000"></label>
        </div>
        <div x-show="tab === 'file'" class="flex flex-col gap-4" style="display:none;">
            <label>Directory <input type="text" class="w-full mt-1 bg-slate-900 border border-slate-700 p-2 rounded" value="/nfs/shared/inbound"></label>
            <label>Include Pattern <input type="text" class="w-full mt-1 bg-slate-900 border border-slate-700 p-2 rounded" value="*.csv"></label>
            <label>Polling Delay (ms) <input type="number" class="w-full mt-1 bg-slate-900 border border-slate-700 p-2 rounded" value="10000"></label>
        </div>
        <div class="mt-6 flex justify-end"><button class="bg-blue-600 px-6 py-2 rounded font-bold text-white hover:bg-blue-500">Save Configuration</button></div>
    </div>
</body>
</html>
