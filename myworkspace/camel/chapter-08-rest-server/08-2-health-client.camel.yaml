# ID: health-client
# ENABLED: true
# DESCRIPTION: A monitoring client that periodically polls the Health Server (08-1).
# AUTHOR: Camel Studio

- route:
    id: "health-monitor-client"
    from:
      uri: "timer:health-poll?period=5000&delay=3000"
      steps:
        - log: "[Chapter 8][CLIENT] Polling Server Health (/health)..."
        - setHeader:
            name: "CamelHttpMethod"
            constant: "GET"
        - to: "http://localhost:9090/health"
        - log: "[Chapter 8][CLIENT] Health Status: ${body}"
