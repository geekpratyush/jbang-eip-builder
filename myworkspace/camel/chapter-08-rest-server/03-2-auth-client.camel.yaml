# ID: auth-client
# ENABLED: true
# DESCRIPTION: A client that tests the Auth Server (03-1). It makes one request WITHOUT the key,
#   and then another request WITH the correct API key to demonstrate security in action.
# AUTHOR: Camel Studio

- route:
    id: "auth-client"
    from:
      uri: "timer:auth-client?period=10000&delay=3000"
      steps:
        - log: "[Chapter 8][CLIENT] Step 1: Sending request WITHOUT API Key..."
        - setHeader:
            name: "CamelHttpMethod"
            constant: "GET"
        - doTry:
            steps:
              - to: "http://localhost:9090/secure/data"
            doCatch:
              - exception:
                  - "org.apache.camel.http.base.HttpOperationFailedException"
                steps:
                  - log: "[Chapter 8][CLIENT] Server rejected request! (401 Unauthorized)"
        
        - log: "[Chapter 8][CLIENT] Step 2: Sending request WITH correct API Key..."
        - setHeader:
            name: "X-API-Key"
            constant: "secret123"
        - to: "http://localhost:9090/secure/data"
        - log: "[Chapter 8][CLIENT] Server Success Response: ${body}"
