# ID: hello-client
# ENABLED: true
# DESCRIPTION: A timer-based client that makes an actual HTTP GET request to the Hello Server.
#   Run this file AT THE SAME TIME as 01-1-hello-server by checking both boxes and clicking Play!
# AUTHOR: Camel Studio
# STUB: none

- route:
    id: "http-hello-client"
    from:
      uri: "timer:hello-client?period=5000&delay=2000"
      steps:
        - log: "[Chapter 8][CLIENT] Preparing to call Hello Server..."
        - to: "http://localhost:9090/hello?name=Tessera+HTTP+Client"
        - log: "[Chapter 8][CLIENT] Received Response from Server: ${body}"
