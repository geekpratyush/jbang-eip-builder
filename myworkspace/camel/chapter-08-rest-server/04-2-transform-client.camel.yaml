# ID: transform-client
# ENABLED: true
# DESCRIPTION: A client that sends raw JSON payments to the Transform Server (04-1).
# AUTHOR: Camel Studio

- route:
    id: "transform-client"
    from:
      uri: "timer:transform-client?period=8000&delay=3000"
      steps:
        - log: "[Chapter 8][CLIENT] Sending raw payment JSON to Transform Server..."
        - setBody:
            constant: '{"amount": 250, "currency": "EUR"}'
        - setHeader:
            name: "CamelHttpMethod"
            constant: "POST"
        - setHeader:
            name: "Content-Type"
            constant: "application/json"
        - to: "http://localhost:9090/api/payments"
        - log: "[Chapter 8][CLIENT] Server returned transformed Canonical JSON response: \n${body}"
