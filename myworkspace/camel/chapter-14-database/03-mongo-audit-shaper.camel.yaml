# ID: mongo-audit-shaper
# DESCRIPTION: Fetch data from MongoDB and process it through the Tessera Audit Shaper
# camel-k: dependency=mvn:org.apache.camel:camel-mongodb:4.18.0
# camel-k: dependency=mvn:com.tessera:tessera-audit-shaper:1.0.0-SNAPSHOT

- beans:
    - name: "auditProcessor"
      type: "com.tessera.audit.AuditShaperProcessor"

- route:
    id: "mongo-audit-shaping-route"
    from:
      uri: "timer:mongo-audit-shaper?repeatCount=1&delay=3000"
      steps:
        - log: "1. Preparing sensitive user data..."
        - setBody:
            constant: >
              {
                "userId": "U-88421",
                "name": "Jane Doe",
                "email": "jane.doe@example.com",
                "creditCard": "4532-1122-3344-5566",
                "balance": 15000.50
              }
        
        # Insert raw sensitive data into 'users' collection
        - to: "mongodb:mongoBean?database=appdb&collection=users&operation=insert"
        - log: "Inserted sensitive user record into MongoDB."

        # Fetch it back
        - setBody:
            constant: >
              {"userId": "U-88421"}
        - to: "mongodb:mongoBean?database=appdb&collection=users&operation=findAll"
        
        # The result from Mongo is a List/Document. Pass it through Audit Shaper
        - log: "2. Fetched raw data from Mongo. Applying Tessera Audit Shaper..."
        - setHeader:
            name: "CamelAuditPrettyPrint"
            constant: "true"
        - setHeader:
            name: "CamelAuditExcludeFields"
            constant: "$._id" # Remove Mongo internal ID from audit
        - process:
            ref: "auditProcessor"
            
        - log: "3. Secured Audit Record ready for downstream logging:\n${body}"
