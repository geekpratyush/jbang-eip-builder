<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tessera | Mermaid Playground</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #1e1e1e; color: #d4d4d4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .toolbar { height: 48px; background: #252526; border-bottom: 1px solid #3c3c3c; display: flex; align-items: center; padding: 0 16px; gap: 16px; }
        select, button { background: #3c3c3c; color: white; border: 1px solid #555; padding: 4px 12px; border-radius: 4px; font-size: 13px; outline: none; cursor: pointer; }
        select:hover, button:hover { background: #4a4a4a; }
        .split-view { display: flex; height: calc(100vh - 48px); }
        #editor-container { width: 40%; height: 100%; border-right: 1px solid #3c3c3c; }
        #preview-container { width: 60%; height: 100%; background: #ffffff; position: relative; overflow: hidden; }
        #mermaid-output { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        #mermaid-output svg { width: 100%; height: 100%; }
        #error-overlay { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(220, 38, 38, 0.9); color: white; padding: 12px; font-family: monospace; display: none; z-index: 10; }
        
        .preview-controls { position: absolute; bottom: 24px; right: 24px; background: white; padding: 4px; border-radius: 6px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); display: flex; gap: 4px; z-index: 10; border: 1px solid #ccc; }
        .icon-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: transparent; border: none; cursor: pointer; color: #333; font-weight: bold; }
        .icon-btn:hover { background: #eee; }
    </style>
</head>
<body>
    <div class="toolbar">
        <div class="font-bold text-sky-400">Mermaid Playground</div>
        <div class="flex-1"></div>
        <select id="example-selector">
            <option value="flowchart">Flowchart</option>
            <option value="sequence">Sequence Diagram</option>
            <option value="class">Class Diagram</option>
            <option value="state">State Diagram</option>
            <option value="gantt">Gantt Chart</option>
            <option value="er">Entity Relationship</option>
            <option value="journey">User Journey</option>
            <option value="git">Gitgraph</option>
            <option value="mindmap">Mindmap</option>
            <option value="pie">Pie Chart</option>
        </select>
        <button id="render-btn" class="bg-sky-600 border-sky-500 hover:bg-sky-500">Manual Render</button>
        <button id="download-svg" class="bg-emerald-600 border-emerald-500 hover:bg-emerald-500 flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            Export SVG
        </button>
    </div>

    <div class="split-view">
        <div id="editor-container"></div>
        <div id="preview-container">
            <div id="mermaid-output"></div>
            <div id="error-overlay"></div>
            <div class="preview-controls">
                <button class="icon-btn" id="zoom-in" title="Zoom In">+</button>
                <button class="icon-btn" id="zoom-out" title="Zoom Out">-</button>
                <button class="icon-btn" id="zoom-reset" title="Reset Zoom">↺</button>
            </div>
        </div>
    </div>

    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        
        mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
        let panZoomInstance = null;

        const examples = {
            flowchart: `graph TD\n    A[Client] -->|HTTP POST| B(Gateway)\n    B --> C{Authentication}\n    C -->|Success| D[Service A]\n    C -->|Failure| E[Error Handler]\n    D --> F[(Database)]`,
            sequence: `sequenceDiagram\n    participant Alice\n    participant Bob\n    Alice->>John: Hello John, how are you?\n    loop Healthcheck\n        John->>John: Fight against hypochondria\n    end\n    Note right of John: Rational thoughts <br/>prevail!\n    John-->>Alice: Great!\n    John->>Bob: How about you?\n    Bob-->>John: Jolly good!`,
            class: `classDiagram\n    Animal <|-- Duck\n    Animal <|-- Fish\n    Animal <|-- Zebra\n    Animal : +int age\n    Animal : +String gender\n    Animal: +isMammal()\n    Animal: +mate()\n    class Duck{\n      +String beakColor\n      +swim()\n      +quack()\n    }\n    class Fish{\n      -int sizeInFeet\n      -canEat()\n    }\n    class Zebra{\n      +bool is_wild\n      +run()\n    }`,
            state: `stateDiagram-v2\n    [*] --> Still\n    Still --> [*]\n    Still --> Moving\n    Moving --> Still\n    Moving --> Crash\n    Crash --> [*]`,
            gantt: `gantt\n    title A Gantt Diagram\n    dateFormat  YYYY-MM-DD\n    section Section\n    A task           :a1, 2014-01-01, 30d\n    Another task     :after a1  , 20d\n    section Another\n    Task in sec      :2014-01-12  , 12d\n    another task      : 24d`,
            er: `erDiagram\n    CUSTOMER ||--o{ ORDER : places\n    ORDER ||--|{ LINE-ITEM : contains\n    CUSTOMER }|..|{ DELIVERY-ADDRESS : uses`,
            journey: `journey\n    title My working day\n    section Go to work\n      Make tea: 5: Me\n      Go upstairs: 3: Me\n      Do work: 1: Me, Cat\n    section Go home\n      Go downstairs: 5: Me\n      Sit down: 5: Me`,
            git: `gitGraph\n    commit\n    commit\n    branch develop\n    checkout develop\n    commit\n    commit\n    checkout main\n    merge develop\n    commit\n    commit`,
            mindmap: `mindmap\n  root((mindmap))\n    Origins\n      Popularisation\n        British popular psychology author Tony Buzan\n    Research\n      On effectiveness<br/>and features\n      On Automatic creation\n        Uses\n            Creative techniques\n            Strategic planning\n            Argument mapping\n    Tools\n      Pen and paper\n      Mermaid`,
            pie: `pie title Pets adopted by volunteers\n    "Dogs" : 386\n    "Cats" : 85\n    "Rats" : 15`
        };

        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            window.editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: examples.flowchart,
                language: 'markdown',
                theme: 'vs-dark',
                minimap: { enabled: false },
                automaticLayout: true,
                fontSize: 14
            });

            let renderTimeout;
            
            async function renderDiagram() {
                const code = editor.getValue();
                const output = document.getElementById('mermaid-output');
                const errorOverlay = document.getElementById('error-overlay');
                
                try {
                    const id = 'mermaid-' + Date.now();
                    const { svg } = await mermaid.render(id, code);
                    
                    if (panZoomInstance) {
                        panZoomInstance.destroy();
                        panZoomInstance = null;
                    }
                    
                    output.innerHTML = svg;
                    errorOverlay.style.display = 'none';
                    
                    const svgElement = output.querySelector('svg');
                    svgElement.removeAttribute('style');
                    svgElement.setAttribute('width', '100%');
                    svgElement.setAttribute('height', '100%');
                    
                    panZoomInstance = svgPanZoom(svgElement, {
                        zoomEnabled: true,
                        controlIconsEnabled: false,
                        fit: true,
                        center: true,
                        mouseWheelZoomEnabled: true
                    });
                } catch (err) {
                    errorOverlay.innerText = err.message || err;
                    errorOverlay.style.display = 'block';
                }
            }

            editor.onDidChangeModelContent(() => {
                clearTimeout(renderTimeout);
                renderTimeout = setTimeout(renderDiagram, 500);
            });

            document.getElementById('example-selector').addEventListener('change', (e) => {
                editor.setValue(examples[e.target.value]);
            });

            document.getElementById('render-btn').addEventListener('click', renderDiagram);
            
            document.getElementById('download-svg').addEventListener('click', () => {
                const svgElement = document.querySelector('#mermaid-output svg');
                if (!svgElement) return;
                
                const clone = svgElement.cloneNode(true);
                clone.removeAttribute('style');
                const viewport = clone.querySelector('.svg-pan-zoom_viewport');
                if (viewport) viewport.removeAttribute('transform');
                
                const svgData = new XMLSerializer().serializeToString(clone);
                const blob = new Blob([svgData], {type: "image/svg+xml;charset=utf-8"});
                const url = URL.createObjectURL(blob);
                
                const title = document.getElementById('example-selector').value;
                const link = document.createElement("a");
                link.href = url;
                link.download = `${title || 'mermaid_diagram'}.svg`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
            
            document.getElementById('zoom-in').addEventListener('click', () => { if(panZoomInstance) panZoomInstance.zoomIn() });
            document.getElementById('zoom-out').addEventListener('click', () => { if(panZoomInstance) panZoomInstance.zoomOut() });
            document.getElementById('zoom-reset').addEventListener('click', () => { 
                if(panZoomInstance) {
                    panZoomInstance.resetZoom();
                    panZoomInstance.center();
                }
            });

            // Initial render
            setTimeout(renderDiagram, 500);
        });
    </script>
</body>
</html>
