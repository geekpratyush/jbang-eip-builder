# ID: xslt-visualizer
# DESCRIPTION: Serves the XSLT Visualizer Studio application

- rest:
    get:
      - path: "/"
        produces: "text/html"
        to: "direct:serve-08-app"

- route:
    id: "serve-08-app"
    from:
      uri: "direct:serve-08-app"
      steps:
        - setBody:
            constant: "resource:file:../assets/chapter-16-ui-dashboard/08/ui/index.html"
        - convertBodyTo: "java.lang.String"
        - setHeader:
            name: "Content-Type"
            constant: "text/html"
