# ID: topology-studio
# DESCRIPTION: Serves the full-page Topology & Orchestration Studio application

- rest:
    get:
      - path: "/"
        produces: "text/html"
        to: "direct:serve-02-app"

- route:
    id: "serve-02-app"
    from:
      uri: "direct:serve-02-app"
      steps:
        - setBody:
            constant: "resource:file:../assets/chapter-16-ui-dashboard/02/ui/index.html"
        - convertBodyTo: "java.lang.String"
        - setHeader:
            name: "Content-Type"
            constant: "text/html"
