# ID: kamelet-catalog
# DESCRIPTION: Serves the Kamelet Catalog Browser UI prototype.
# camel-k: dependency=mvn:org.apache.camel:camel-sql:4.18.0
# camel-k: dependency=mvn:org.apache.camel:camel-jackson:4.18.0

- route:
    id: "ui-02-kamelets-init"
    from:
      uri: "timer:init-02-2?repeatCount=1&delay=500"
      steps:
        - to: "sql:CREATE TABLE IF NOT EXISTS ui_features (id VARCHAR(50) PRIMARY KEY, title VARCHAR(100), endpoint VARCHAR(100), type VARCHAR(50), icon VARCHAR(50))"
        - to: "sql:MERGE INTO ui_features (id, title, endpoint, type, icon) KEY(id) VALUES ('kamelets', 'Kamelet Catalog Browser', '/02/kamelets', 'UI', 'fas fa-plug')"
        - log: "Module 02 - Kamelet Catalog Browser registered."

- rest:
    get:
      - path: "/02/kamelets"
        produces: "text/html"
        to: "direct:serve-02-kamelets"

- route:
    id: "ui-serve-02-kamelets"
    from:
      uri: "direct:serve-02-kamelets"
      steps:
        - setBody:
            constant: "resource:file:../assets/chapter-16-ui-dashboard/01/ui/01-5-kamelet-catalog-browser.html"
        - convertBodyTo: "java.lang.String"
        - setHeader:
            name: "Content-Type"
            constant: "text/html"
