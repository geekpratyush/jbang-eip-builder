# ID: truncation-enrichment-rules
# DESCRIPTION: Data grid for field-level rules.
# camel-k: dependency=mvn:org.apache.camel:camel-sql:4.18.0
# camel-k: dependency=mvn:org.apache.camel:camel-jackson:4.18.0

- route:
    id: "ui-03-rules-init"
    from:
      uri: "timer:init-03-2?repeatCount=1&delay=500"
      steps:
        - to: "sql:CREATE TABLE IF NOT EXISTS ui_features (id VARCHAR(50) PRIMARY KEY, title VARCHAR(100), endpoint VARCHAR(100), type VARCHAR(50), icon VARCHAR(50))"
        - to: "sql:MERGE INTO ui_features (id, title, endpoint, type, icon) KEY(id) VALUES ('rules', 'Truncation & Enrichment Rules', '/03/rules', 'UI', 'fas fa-ruler-combined')"

- rest:
    get:
      - path: "/03/rules"
        produces: "text/html"
        to: "direct:serve-03-rules"

- route:
    id: "ui-serve-03-rules"
    from:
      uri: "direct:serve-03-rules"
      steps:
        - setBody:
            constant: "resource:file:../assets/chapter-16-ui-dashboard/01/ui/01-8-truncation-enrichment-rules.html"
        - convertBodyTo: "java.lang.String"
        - setHeader:
            name: "Content-Type"
            constant: "text/html"
