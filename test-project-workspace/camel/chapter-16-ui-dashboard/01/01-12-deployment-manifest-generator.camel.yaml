# ID: deployment-manifest-generator
# DESCRIPTION: Kubernetes Deployment YAML.
# camel-k: dependency=mvn:org.apache.camel:camel-sql:4.18.0
# camel-k: dependency=mvn:org.apache.camel:camel-jackson:4.18.0

- route:
    id: "ui-04-manifest-init"
    from:
      uri: "timer:init-04-3?repeatCount=1&delay=1000"
      steps:
        - to: "sql:CREATE TABLE IF NOT EXISTS ui_features (id VARCHAR(50) PRIMARY KEY, title VARCHAR(100), endpoint VARCHAR(100), type VARCHAR(50), icon VARCHAR(50))"
        - to: "sql:MERGE INTO ui_features (id, title, endpoint, type, icon) KEY(id) VALUES ('manifest', 'Deployment Manifest', '/04/manifest', 'UI', 'fas fa-file-code')"

- rest:
    get:
      - path: "/04/manifest"
        produces: "text/html"
        to: "direct:serve-04-manifest"

- route:
    id: "ui-serve-04-manifest"
    from:
      uri: "direct:serve-04-manifest"
      steps:
        - setBody:
            constant: "resource:file:../assets/chapter-16-ui-dashboard/01/ui/01-12-deployment-manifest-generator.html"
        - convertBodyTo: "java.lang.String"
        - setHeader:
            name: "Content-Type"
            constant: "text/html"
