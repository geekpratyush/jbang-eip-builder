# ID: error-root-cause-analyzer
# DESCRIPTION: Diff view for errors.
# camel-k: dependency=mvn:org.apache.camel:camel-sql:4.18.0
# camel-k: dependency=mvn:org.apache.camel:camel-jackson:4.18.0

- route:
    id: "ui-06-analyzer-init"
    from:
      uri: "timer:init-06-3?repeatCount=1&delay=1000"
      steps:
        - to: "sql:CREATE TABLE IF NOT EXISTS ui_features (id VARCHAR(50) PRIMARY KEY, title VARCHAR(100), endpoint VARCHAR(100), type VARCHAR(50), icon VARCHAR(50))"
        - to: "sql:MERGE INTO ui_features (id, title, endpoint, type, icon) KEY(id) VALUES ('analyzer', 'Error Analyzer', '/06/analyzer', 'UI', 'fas fa-microscope')"

- rest:
    get:
      - path: "/06/analyzer"
        produces: "text/html"
        to: "direct:serve-06-analyzer"

- route:
    id: "ui-serve-06-analyzer"
    from:
      uri: "direct:serve-06-analyzer"
      steps:
        - setBody:
            constant: "resource:file:../assets/chapter-16-ui-dashboard/01/ui/01-18-error-root-cause-analyzer.html"
        - convertBodyTo: "java.lang.String"
        - setHeader:
            name: "Content-Type"
            constant: "text/html"
