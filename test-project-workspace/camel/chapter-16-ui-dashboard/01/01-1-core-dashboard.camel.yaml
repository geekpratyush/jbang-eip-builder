# ID: core-dashboard
# DESCRIPTION: Core UI Platform - Hosts the base HTML, theme engine, and the dynamic Feature Registry using H2 SQL.
# camel-k: dependency=mvn:org.apache.camel:camel-sql:4.18.0
# camel-k: dependency=mvn:org.apache.camel:camel-jackson:4.18.0

- route:
    id: "ui-core-init"
    from:
      uri: "timer:init-core?repeatCount=1"
      steps:
        # Initialize Feature Registry
        - to: "sql:CREATE TABLE IF NOT EXISTS ui_features (id VARCHAR(50) PRIMARY KEY, title VARCHAR(100), endpoint VARCHAR(100), type VARCHAR(50), icon VARCHAR(50))"
        - log: "UI Core Framework initialized. Feature Registry DB is ready."

- rest:
    get:
      - path: "/"
        produces: "text/html"
        to: "direct:serve-index"
      - path: "/api/features"
        produces: "application/json"
        to: "direct:get-features"

- route:
    id: "ui-serve-html"
    from:
      uri: "direct:serve-index"
      steps:
        - setBody:
            constant: "resource:file:../assets/chapter-16-ui-dashboard/01/ui/index.html"
        - convertBodyTo: "java.lang.String"
        - setHeader:
            name: "Content-Type"
            constant: "text/html"

- route:
    id: "ui-api-features"
    from:
      uri: "direct:get-features"
      steps:
        - to: "sql:CREATE TABLE IF NOT EXISTS ui_features (id VARCHAR(50) PRIMARY KEY, title VARCHAR(100), endpoint VARCHAR(100), type VARCHAR(50), icon VARCHAR(50))"
        - to: "sql:SELECT * FROM ui_features"
        - marshal:
            json: {}
        - setHeader:
            name: "Content-Type"
            constant: "application/json"
