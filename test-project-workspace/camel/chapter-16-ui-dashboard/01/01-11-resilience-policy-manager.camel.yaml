# ID: resilience-policy-manager
# DESCRIPTION: Circuit breaker and exponential backoff config.
# camel-k: dependency=mvn:org.apache.camel:camel-sql:4.18.0
# camel-k: dependency=mvn:org.apache.camel:camel-jackson:4.18.0

- route:
    id: "ui-04-policy-init"
    from:
      uri: "timer:init-04-2?repeatCount=1&delay=500"
      steps:
        - to: "sql:CREATE TABLE IF NOT EXISTS ui_features (id VARCHAR(50) PRIMARY KEY, title VARCHAR(100), endpoint VARCHAR(100), type VARCHAR(50), icon VARCHAR(50))"
        - to: "sql:MERGE INTO ui_features (id, title, endpoint, type, icon) KEY(id) VALUES ('policy', 'Resilience Policy Manager', '/04/policy', 'UI', 'fas fa-shield-alt')"

- rest:
    get:
      - path: "/04/policy"
        produces: "text/html"
        to: "direct:serve-04-policy"

- route:
    id: "ui-serve-04-policy"
    from:
      uri: "direct:serve-04-policy"
      steps:
        - setBody:
            constant: "resource:file:../assets/chapter-16-ui-dashboard/01/ui/01-11-resilience-policy-manager.html"
        - convertBodyTo: "java.lang.String"
        - setHeader:
            name: "Content-Type"
            constant: "text/html"
