# ID: gateway-command-center
# DESCRIPTION: Serves the API Gateway Command Center application

- rest:
    get:
      - path: "/"
        produces: "text/html"
        to: "direct:serve-04-app"

- route:
    id: "serve-04-app"
    from:
      uri: "direct:serve-04-app"
      steps:
        - setBody:
            constant: "resource:file:../assets/chapter-16-ui-dashboard/04/ui/index.html"
        - convertBodyTo: "java.lang.String"
        - setHeader:
            name: "Content-Type"
            constant: "text/html"
