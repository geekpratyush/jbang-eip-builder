# ID: transformation-studio
# DESCRIPTION: Serves the Data Transformation & Governance application

- rest:
    get:
      - path: "/"
        produces: "text/html"
        to: "direct:serve-03-app"

- route:
    id: "serve-03-app"
    from:
      uri: "direct:serve-03-app"
      steps:
        - setBody:
            constant: "resource:file:../assets/chapter-16-ui-dashboard/03/ui/index.html"
        - convertBodyTo: "java.lang.String"
        - setHeader:
            name: "Content-Type"
            constant: "text/html"
