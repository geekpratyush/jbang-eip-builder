# ID: upload-client
# ENABLED: true
# DESCRIPTION: A client that uploads a file payload to the Upload Server (07-1).
# AUTHOR: Camel Studio

- route:
    id: "upload-client"
    from:
      uri: "timer:upload-client?period=10000&delay=3000"
      steps:
        - log: "[Chapter 8][CLIENT] Preparing a payload to upload..."
        - setBody:
            constant: "This is some dummy file content generated by the client!"
        - setHeader:
            name: "CamelHttpMethod"
            constant: "POST"
        - setHeader:
            name: "Content-Type"
            constant: "text/plain"
        - to: "http://localhost:9090/upload"
        - log: "[Chapter 8][CLIENT] Upload complete! Server response: ${body}"
