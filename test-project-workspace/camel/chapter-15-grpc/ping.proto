syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.tessera.grpc.ping";
option java_outer_classname = "PingProto";

package ping;

// The Ping service definition.
service PingService {
  // Sends a ping
  rpc Ping (PingRequest) returns (PingReply) {}
}

// The request message containing the client's name.
message PingRequest {
  string ping_name = 1;
}

// The response message containing the greetings.
message PingReply {
  string pong_message = 1;
}
