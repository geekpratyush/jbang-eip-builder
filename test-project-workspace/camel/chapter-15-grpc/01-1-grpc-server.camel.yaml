# ID: grpc-ping-server
# ENABLED: false
# DESCRIPTION: A gRPC Server example using camel-grpc.
#   NOTE: This file cannot run directly in JBang because gRPC strictly requires 
#   compiled Java class stubs (generated from ping.proto) to be on the classpath.
# AUTHOR: Camel Studio
# STUB: none

- route:
    id: "grpc-server"
    # The URI specifies the host, port, and the FULLY QUALIFIED class name of the generated gRPC Service
    from:
      uri: "grpc://0.0.0.0:9091/com.tessera.grpc.ping.PingService?consumerStrategy=PROPAGATION"
      steps:
        - log: "[gRPC Server] Received PingRequest! Body: ${body}"
      # The body coming in is a PingRequest Java object. 
      # We extract the name from it (assuming compiled Java classes are present)
        - setHeader:
            name: "clientName"
            simple: "${body.pingName}"
      # We create the response object using a Java bean or simple expression
        - setBody:
            simple: 'bean:com.tessera.grpc.ping.PingReply?method=newBuilder().setPongMessage("Hello ${header.clientName}, from Camel gRPC!").build()'
        - log: "[gRPC Server] Sending PingReply back to client."
