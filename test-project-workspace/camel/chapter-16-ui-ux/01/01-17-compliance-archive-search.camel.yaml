# ID: compliance-archive-search
# DESCRIPTION: Paginated data grid for archive.
# camel-k: dependency=mvn:org.apache.camel:camel-sql:4.18.0
# camel-k: dependency=mvn:org.apache.camel:camel-jackson:4.18.0

- route:
    id: "ui-06-archive-init"
    from:
      uri: "timer:init-06-2?repeatCount=1&delay=500"
      steps:
        - to: "sql:CREATE TABLE IF NOT EXISTS ui_features (id VARCHAR(50) PRIMARY KEY, title VARCHAR(100), endpoint VARCHAR(100), type VARCHAR(50), icon VARCHAR(50))"
        - to: "sql:MERGE INTO ui_features (id, title, endpoint, type, icon) KEY(id) VALUES ('archive', 'Compliance Archive Search', '/06/archive', 'UI', 'fas fa-search')"

- rest:
    get:
      - path: "/06/archive"
        produces: "text/html"
        to: "direct:serve-06-archive"

- route:
    id: "ui-serve-06-archive"
    from:
      uri: "direct:serve-06-archive"
      steps:
        - setBody:
            constant: "resource:file:{{WORKSPACE_ROOT_DIR}}/assets/chapter-16-ui-ux/01/ui/01-17-compliance-archive-search.html"
        - convertBodyTo: "java.lang.String"
        - setHeader:
            name: "Content-Type"
            constant: "text/html"
