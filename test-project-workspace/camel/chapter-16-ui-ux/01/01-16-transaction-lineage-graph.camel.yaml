# ID: transaction-lineage-graph
# DESCRIPTION: State diagram tracking individual messages.
# camel-k: dependency=mvn:org.apache.camel:camel-sql:4.18.0
# camel-k: dependency=mvn:org.apache.camel:camel-jackson:4.18.0

- route:
    id: "ui-06-lineage-init"
    from:
      uri: "timer:init-06-1?repeatCount=1"
      steps:
        - to: "sql:CREATE TABLE IF NOT EXISTS ui_features (id VARCHAR(50) PRIMARY KEY, title VARCHAR(100), endpoint VARCHAR(100), type VARCHAR(50), icon VARCHAR(50))"
        - to: "sql:MERGE INTO ui_features (id, title, endpoint, type, icon) KEY(id) VALUES ('lineage', 'Transaction Lineage', '/06/lineage', 'UI', 'fas fa-project-diagram')"

- rest:
    get:
      - path: "/06/lineage"
        produces: "text/html"
        to: "direct:serve-06-lineage"

- route:
    id: "ui-serve-06-lineage"
    from:
      uri: "direct:serve-06-lineage"
      steps:
        - setBody:
            constant: "resource:file:{{WORKSPACE_ROOT_DIR}}/assets/chapter-16-ui-ux/01/ui/01-16-transaction-lineage-graph.html"
        - convertBodyTo: "java.lang.String"
        - setHeader:
            name: "Content-Type"
            constant: "text/html"
