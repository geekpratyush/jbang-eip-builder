# ID: mt-to-mx-mapper
# DESCRIPTION: Universal Payload Translation (MT103 -> pacs.008)
# camel-k: dependency=mvn:org.apache.camel:camel-sql:4.18.0
# camel-k: dependency=mvn:org.apache.camel:camel-jackson:4.18.0

- route:
    id: "ui-03-mapper-init"
    from:
      uri: "timer:init-03-1?repeatCount=1"
      steps:
        - to: "sql:CREATE TABLE IF NOT EXISTS ui_features (id VARCHAR(50) PRIMARY KEY, title VARCHAR(100), endpoint VARCHAR(100), type VARCHAR(50), icon VARCHAR(50))"
        - to: "sql:MERGE INTO ui_features (id, title, endpoint, type, icon) KEY(id) VALUES ('mapper', 'MT to MX Mapper', '/03/mapper', 'UI', 'fas fa-exchange-alt')"
        - log: "Module 03 - MT to MX Mapper registered."

- rest:
    get:
      - path: "/03/mapper"
        produces: "text/html"
        to: "direct:serve-03-mapper"

- route:
    id: "ui-serve-03-mapper"
    from:
      uri: "direct:serve-03-mapper"
      steps:
        - setBody:
            constant: "resource:file:{{WORKSPACE_ROOT_DIR}}/assets/chapter-16-ui-ux/01-ui-core/ui/01-7-mt-to-mx-mapper.html"
        - convertBodyTo: "java.lang.String"
        - setHeader:
            name: "Content-Type"
            constant: "text/html"
