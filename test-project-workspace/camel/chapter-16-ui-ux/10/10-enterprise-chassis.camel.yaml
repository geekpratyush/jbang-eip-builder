- route:
    id: "10-enterprise-chassis-init"
    from:
      uri: "timer:init-db?repeatCount=1"
      steps:
        - log: "Bootstrapping Modular Integration Chassis database..."
        - to: "sql:CREATE SCHEMA IF NOT EXISTS chassis"
        - to: "sql:DROP TABLE IF EXISTS chassis.transactions"
        - to: "sql:CREATE TABLE chassis.transactions (id VARCHAR(50) PRIMARY KEY, counterparty VARCHAR(100), transaction_type VARCHAR(50), amount DECIMAL(18,2), currency VARCHAR(10), status VARCHAR(50), created_at TIMESTAMP)"
        - to: "sql:CREATE SEQUENCE IF NOT EXISTS chassis.txn_seq START WITH 200000"
        - log: "Generating 50,000 mock transaction records completely in-database..."
        - to: "sql:INSERT INTO chassis.transactions (id, counterparty, transaction_type, amount, currency, status, created_at) SELECT 'TXN-' || (100000 + x), ARRAY_GET(ARRAY['Global Industries LLC', 'Stark Logistics', 'Oceanic Trade Corp', 'Acme Financials', 'Wayne Enterprises', 'LexCorp', 'Cyberdyne Systems', 'Umbrella Corp', 'Massive Dynamic', 'Tyrell Corp', 'Weyland-Yutani', 'Oscorp', 'Initech', 'Hooli Inc', 'Virtucon', 'Soylent Corp'], CAST(RAND() * 16 AS INT) + 1), ARRAY_GET(ARRAY['PAYMENT', 'EARMARK', 'SWIFT_TRANSFER', 'DIRECT_DEBIT', 'CREDIT_ALLOCATION', 'LIQUIDITY_SWAP'], CAST(RAND() * 6 AS INT) + 1), ROUND(RAND() * 250000 + 100, 2), ARRAY_GET(ARRAY['USD', 'EUR', 'GBP', 'JPY', 'CHF', 'CAD'], CAST(RAND() * 6 AS INT) + 1), ARRAY_GET(ARRAY['PENDING_APPROVAL', 'APPROVED', 'REJECTED', 'PROCESSING', 'COMPLETED', 'FAILED'], CAST(RAND() * 6 AS INT) + 1), DATEADD('MINUTE', -x, CURRENT_TIMESTAMP()) FROM SYSTEM_RANGE(1, 50000)"
        - log: "Successfully populated database with 50,000 records!"

- route:
    id: "10-enterprise-chassis-ui"
    from:
      uri: "platform-http:/"
      steps:
        - setHeader:
            name: "Content-Type"
            constant: "text/html"
        - setBody:
            constant: "resource:file:{{WORKSPACE_ROOT_DIR}}/assets/chapter-16-ui-ux/10/ui/index.html"
        - convertBodyTo: "java.lang.String"

- route:
    id: "10-api-records"
    from:
      uri: "platform-http:/api/records"
      steps:
        # Default parameter checks
        - choice:
            when:
              - simple: "${header.page} == null || ${header.page} == ''"
                steps:
                  - setHeader:
                      name: "page"
                      constant: "1"
        - choice:
            when:
              - simple: "${header.size} == null || ${header.size} == ''"
                steps:
                  - setHeader:
                      name: "size"
                      constant: "15"
        - choice:
            when:
              - simple: "${header.sort} == null || ${header.sort} == ''"
                steps:
                  - setHeader:
                      name: "sort"
                      constant: "created_at"
        - choice:
            when:
              - simple: "${header.order} == null || ${header.order} == ''"
                steps:
                  - setHeader:
                      name: "order"
                      constant: "desc"
        - choice:
            when:
              - simple: "${header.filter} == null"
                steps:
                  - setHeader:
                      name: "filter"
                      constant: ""
        - setHeader:
            name: "sqlFilter"
            simple: "%${header.filter}%"
        # Calculate offset via database select to avoid any Java execution
        - toD: "sql:SELECT (CAST(:#page AS INT) - 1) * CAST(:#size AS INT)?outputType=SelectOne"
        - setHeader:
            name: "offset"
            simple: "${body}"
        # Fetch total records count matching filter
        - toD: "sql:SELECT COUNT(*) FROM chassis.transactions WHERE (LOWER(counterparty) LIKE :#sqlFilter OR LOWER(id) LIKE :#sqlFilter OR :#sqlFilter IS NULL)?outputType=SelectOne"
        - setHeader:
            name: "totalRecords"
            simple: "${body}"
        # Fetch data page matching sorting and pagination
        - toD: "sql:SELECT id, counterparty, transaction_type as transaction_type, amount, currency, status, created_at as created_at FROM chassis.transactions WHERE (LOWER(counterparty) LIKE :#sqlFilter OR LOWER(id) LIKE :#sqlFilter OR :#sqlFilter IS NULL) ORDER BY ${header.sort} ${header.order} LIMIT :#size OFFSET :#offset"
        - marshal:
            json: {}
        - setBody:
            simple: "{\"total\": ${header.totalRecords}, \"data\": ${body}}"
        - setHeader:
            name: "Content-Type"
            constant: "application/json"

- route:
    id: "10-api-export-csv"
    from:
      uri: "platform-http:/api/export/csv"
      steps:
        - choice:
            when:
              - simple: "${header.filter} == null"
                steps:
                  - setHeader:
                      name: "filter"
                      constant: ""
        - setHeader:
            name: "sqlFilter"
            simple: "%${header.filter}%"
        - toD: "sql:SELECT id, counterparty, transaction_type as transaction_type, amount, currency, status, created_at as created_at FROM chassis.transactions WHERE (LOWER(counterparty) LIKE :#sqlFilter OR LOWER(id) LIKE :#sqlFilter OR :#sqlFilter IS NULL) ORDER BY created_at DESC LIMIT 5000"
        - marshal:
            csv: {}
        - setHeader:
            name: "Content-Type"
            constant: "text/csv"
        - setHeader:
            name: "Content-Disposition"
            simple: "attachment; filename=transactions-export.csv"

- route:
    id: "10-api-export-excel"
    from:
      uri: "platform-http:/api/export/excel"
      steps:
        # Excel natively parses CSV files perfectly, return CSV with .csv extension
        - to: "direct:export-csv-shared"
        - setHeader:
            name: "Content-Disposition"
            simple: "attachment; filename=transactions-export.csv"

- route:
    id: "10-export-csv-shared"
    from:
      uri: "direct:export-csv-shared"
      steps:
        - choice:
            when:
              - simple: "${header.filter} == null"
                steps:
                  - setHeader:
                      name: "filter"
                      constant: ""
        - setHeader:
            name: "sqlFilter"
            simple: "%${header.filter}%"
        - toD: "sql:SELECT id, counterparty, transaction_type as transaction_type, amount, currency, status, created_at as created_at FROM chassis.transactions WHERE (LOWER(counterparty) LIKE :#sqlFilter OR LOWER(id) LIKE :#sqlFilter OR :#sqlFilter IS NULL) ORDER BY created_at DESC LIMIT 5000"
        - marshal:
            csv: {}
        - setHeader:
            name: "Content-Type"
            constant: "text/csv"

- route:
    id: "10-api-export-pdf"
    from:
      uri: "platform-http:/api/export/pdf"
      steps:
        - setHeader:
            name: "Content-Type"
            constant: "text/html"
        - setBody:
            constant: "resource:file:{{WORKSPACE_ROOT_DIR}}/assets/chapter-16-ui-ux/10/ui/print.html"
        - convertBodyTo: "java.lang.String"

- route:
    id: "10-api-command"
    from:
      uri: "platform-http:/api/command"
      steps:
        - convertBodyTo: "java.lang.String"
        - log: "Chassis Ingestion Command received: ${body}"
        - setHeader:
            name: "cp"
            jsonpath: "$.counterparty"
        - setHeader:
            name: "amt"
            jsonpath: "$.amount"
        - setHeader:
            name: "cur"
            jsonpath: "$.currency"
        - setHeader:
            name: "type"
            jsonpath: "$.transaction_type"
        # Insert database record
        - toD: "sql:INSERT INTO chassis.transactions (id, counterparty, transaction_type, amount, currency, status, created_at) VALUES ('TXN-' || NEXT VALUE FOR chassis.txn_seq, :#cp, :#type, :#amt, :#cur, 'COMPLETED', CURRENT_TIMESTAMP)"
        # Route payload to stubs
        - to: "seda:kafka-topic"
        - to: "seda:ibmmq-queue"
        - to: "seda:email-stub"
        - setBody:
            constant: "{ \"status\": \"INGESTED\", \"message\": \"Payload successfully routed to stubs\" }"
        - setHeader:
            name: "Content-Type"
            constant: "application/json"

- route:
    id: "kafka-stub-consumer"
    from:
      uri: "seda:kafka-topic"
      steps:
        - log: "[KAFKA STUB] Received message on simulated topic 'transactions-inbound': ${body}"

- route:
    id: "ibmmq-stub-consumer"
    from:
      uri: "seda:ibmmq-queue"
      steps:
        - log: "[IBM MQ STUB] Message arrived at Queue 'IN.TXN.QUEUE'. Executing validation..."
        - choice:
            when:
              - simple: "${body} contains 'FAIL'"
                steps:
                  - log: "[IBM MQ STUB] Validation failed! Sending to DLQ Queue 'IN.TXN.DLQ'..."
                  - to: "seda:ibmmq-dlq"
            otherwise:
              steps:
                - log: "[IBM MQ STUB] Validation passed. Message successfully processed."

- route:
    id: "ibmmq-dlq-consumer"
    from:
      uri: "seda:ibmmq-dlq"
      steps:
        - log: "[IBM MQ DLQ] Dead Letter Queue handler received poison message: ${body}"

- route:
    id: "email-stub-consumer"
    from:
      uri: "seda:email-stub"
      steps:
        - log: "[EMAIL STUB] Outbound Email Intercepted! TO: ops-alerts@chassis.net | FROM: system@chassis.net | SUBJECT: Transaction Ingest Alert | BODY: Transaction payload received."
