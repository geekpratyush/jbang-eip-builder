# ID: 15-03-onboarding-offboarding
# TITLE: Automated Onboarding/Offboarding Orchestrator
# DESCRIPTION: A workflow engine that automatically handles hardware provisioning, software licensing, and access revocation based on HR triggers.
# camel-k: dependency=mvn:org.apache.camel:camel-sql:4.18.0
# camel-k: dependency=mvn:org.apache.camel:camel-jackson:4.18.0

- route:
    id: "15-03-onboarding-offboarding-init"
    from:
      uri: "timer:init?repeatCount=1"
      steps:
        - to: "sql:CREATE TABLE IF NOT EXISTS ui_features (id VARCHAR(50) PRIMARY KEY, title VARCHAR(100), endpoint VARCHAR(100), type VARCHAR(50), icon VARCHAR(50))"
        - to: "sql:MERGE INTO ui_features (id, title, endpoint, type, icon) KEY(id) VALUES ('15-03-onboarding-offboarding', 'Automated Onboarding/Offboarding Orchestrator', '/15-03-onboarding-offboarding/api/telemetry', 'CHART', 'fas fa-user-plus')"
        - log: "[Plugin Activated] Automated Onboarding/Offboarding Orchestrator registered inside Core Dashboard"

# Prefixed UI endpoint (always active)
- route:
    id: "15-03-onboarding-offboarding-ui-prefixed"
    from:
      uri: "platform-http:/15-03-onboarding-offboarding"
      steps:
        - setHeader:
            name: "Content-Type"
            constant: "text/html"
        - setBody:
            constant: "resource:file:{{WORKSPACE_ROOT_DIR}}/assets/chapter-16-ui-ux/15-hcm/15-03-onboarding-offboarding/ui/index.html"
        - convertBodyTo: "java.lang.String"

# Root UI endpoint (active only in standalone mode via CAMEL_UI_ROOT_PATH)
- route:
    id: "15-03-onboarding-offboarding-ui-root"
    from:
      uri: "platform-http:{{env:CAMEL_UI_ROOT_PATH:/disabled-15-03-onboarding-offboarding}}/"
      steps:
        - setHeader:
            name: "Content-Type"
            constant: "text/html"
        - setBody:
            constant: "resource:file:{{WORKSPACE_ROOT_DIR}}/assets/chapter-16-ui-ux/15-hcm/15-03-onboarding-offboarding/ui/index.html"
        - convertBodyTo: "java.lang.String"

# Prefixed Telemetry API endpoint (always active)
- route:
    id: "15-03-onboarding-offboarding-telemetry-api-prefixed"
    from:
      uri: "platform-http:/15-03-onboarding-offboarding/api/telemetry"
      steps:
        - to: "direct:15-03-onboarding-offboarding-telemetry-api-impl"

# Root Telemetry API endpoint (active only in standalone mode via CAMEL_UI_ROOT_PATH)
- route:
    id: "15-03-onboarding-offboarding-telemetry-api-root"
    from:
      uri: "platform-http:{{env:CAMEL_UI_ROOT_PATH:/disabled-15-03-onboarding-offboarding}}/api/telemetry"
      steps:
        - to: "direct:15-03-onboarding-offboarding-telemetry-api-impl"

# Telemetry API Implementation
- route:
    id: "15-03-onboarding-offboarding-telemetry-api-impl"
    from:
      uri: "direct:15-03-onboarding-offboarding-telemetry-api-impl"
      steps:
        # Returns random data for charts telemetry
        - transform:
            groovy: |
                def rand = new java.util.Random()
                def txns = []
                def load = []
                for(int i=0; i<6; i++) {
                    txns.add(rand.nextInt(30) + 5)
                    load.add(rand.nextInt(40) + 40)
                }
                return [
                    "transactions": txns,
                    "systemLoad": load
                ]
        - marshal:
            json: {}
        - setHeader:
            name: "Content-Type"
            constant: "application/json"

# Prefixed Action API endpoint (always active)
- route:
    id: "15-03-onboarding-offboarding-action-api-prefixed"
    from:
      uri: "platform-http:/15-03-onboarding-offboarding/api/action"
      steps:
        - to: "direct:15-03-onboarding-offboarding-action-api-impl"

# Root Action API endpoint (active only in standalone mode via CAMEL_UI_ROOT_PATH)
- route:
    id: "15-03-onboarding-offboarding-action-api-root"
    from:
      uri: "platform-http:{{env:CAMEL_UI_ROOT_PATH:/disabled-15-03-onboarding-offboarding}}/api/action"
      steps:
        - to: "direct:15-03-onboarding-offboarding-action-api-impl"

# Action API Implementation
- route:
    id: "15-03-onboarding-offboarding-action-api-impl"
    from:
      uri: "direct:15-03-onboarding-offboarding-action-api-impl"
      steps:
        - convertBodyTo: "java.lang.String"
        - log: "[Action Triggered] Received operation request: ${body}"
        - setBody:
            constant: '{ "status": "COMPLETED", "message": "Operation successfully executed by Apache Camel Integration Engine" }'
        - setHeader:
            name: "Content-Type"
            constant: "application/json"
