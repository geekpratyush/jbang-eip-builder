# ID: 16-01-b2b-client-portal
# TITLE: B2B Client Self-Service Portal
# DESCRIPTION: A secure application where institutional clients can view their contract status, submit support tickets, and access raw data extracts.
# camel-k: dependency=mvn:org.apache.camel:camel-sql:4.18.0
# camel-k: dependency=mvn:org.apache.camel:camel-jackson:4.18.0

- route:
    id: "16-01-b2b-client-portal-init"
    from:
      uri: "timer:init?repeatCount=1"
      steps:
        - to: "sql:CREATE TABLE IF NOT EXISTS ui_features (id VARCHAR(50) PRIMARY KEY, title VARCHAR(100), endpoint VARCHAR(100), type VARCHAR(50), icon VARCHAR(50))"
        - to: "sql:MERGE INTO ui_features (id, title, endpoint, type, icon) KEY(id) VALUES ('16-01-b2b-client-portal', 'B2B Client Self-Service Portal', '/16-01-b2b-client-portal/api/telemetry', 'CHART', 'fas fa-building')"
        - log: "[Plugin Activated] B2B Client Self-Service Portal registered inside Core Dashboard"

# Prefixed UI endpoint (always active)
- route:
    id: "16-01-b2b-client-portal-ui-prefixed"
    from:
      uri: "platform-http:/16-01-b2b-client-portal"
      steps:
        - setHeader:
            name: "Content-Type"
            constant: "text/html"
        - setBody:
            constant: "resource:file:{{WORKSPACE_ROOT_DIR}}/assets/chapter-16-ui-ux/16-customer-services/16-01-b2b-client-portal/ui/index.html"
        - convertBodyTo: "java.lang.String"

# Root UI endpoint (active only in standalone mode via CAMEL_UI_ROOT_PATH)
- route:
    id: "16-01-b2b-client-portal-ui-root"
    from:
      uri: "platform-http:{{env:CAMEL_UI_ROOT_PATH:/disabled-16-01-b2b-client-portal}}/"
      steps:
        - setHeader:
            name: "Content-Type"
            constant: "text/html"
        - setBody:
            constant: "resource:file:{{WORKSPACE_ROOT_DIR}}/assets/chapter-16-ui-ux/16-customer-services/16-01-b2b-client-portal/ui/index.html"
        - convertBodyTo: "java.lang.String"

# Prefixed Telemetry API endpoint (always active)
- route:
    id: "16-01-b2b-client-portal-telemetry-api-prefixed"
    from:
      uri: "platform-http:/16-01-b2b-client-portal/api/telemetry"
      steps:
        - to: "direct:16-01-b2b-client-portal-telemetry-api-impl"

# Root Telemetry API endpoint (active only in standalone mode via CAMEL_UI_ROOT_PATH)
- route:
    id: "16-01-b2b-client-portal-telemetry-api-root"
    from:
      uri: "platform-http:{{env:CAMEL_UI_ROOT_PATH:/disabled-16-01-b2b-client-portal}}/api/telemetry"
      steps:
        - to: "direct:16-01-b2b-client-portal-telemetry-api-impl"

# Telemetry API Implementation
- route:
    id: "16-01-b2b-client-portal-telemetry-api-impl"
    from:
      uri: "direct:16-01-b2b-client-portal-telemetry-api-impl"
      steps:
        # Returns random data for charts telemetry
        - transform:
            groovy: |
                def rand = new java.util.Random()
                def txns = []
                def load = []
                for(int i=0; i<6; i++) {
                    txns.add(rand.nextInt(30) + 5)
                    load.add(rand.nextInt(40) + 40)
                }
                return [
                    "transactions": txns,
                    "systemLoad": load
                ]
        - marshal:
            json: {}
        - setHeader:
            name: "Content-Type"
            constant: "application/json"

# Prefixed Action API endpoint (always active)
- route:
    id: "16-01-b2b-client-portal-action-api-prefixed"
    from:
      uri: "platform-http:/16-01-b2b-client-portal/api/action"
      steps:
        - to: "direct:16-01-b2b-client-portal-action-api-impl"

# Root Action API endpoint (active only in standalone mode via CAMEL_UI_ROOT_PATH)
- route:
    id: "16-01-b2b-client-portal-action-api-root"
    from:
      uri: "platform-http:{{env:CAMEL_UI_ROOT_PATH:/disabled-16-01-b2b-client-portal}}/api/action"
      steps:
        - to: "direct:16-01-b2b-client-portal-action-api-impl"

# Action API Implementation
- route:
    id: "16-01-b2b-client-portal-action-api-impl"
    from:
      uri: "direct:16-01-b2b-client-portal-action-api-impl"
      steps:
        - convertBodyTo: "java.lang.String"
        - log: "[Action Triggered] Received operation request: ${body}"
        - setBody:
            constant: '{ "status": "COMPLETED", "message": "Operation successfully executed by Apache Camel Integration Engine" }'
        - setHeader:
            name: "Content-Type"
            constant: "application/json"
