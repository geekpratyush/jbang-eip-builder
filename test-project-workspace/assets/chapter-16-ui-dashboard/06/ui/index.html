<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tessera | Global Cluster Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; }
        .node { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; transition: all 0.3s ease; }
        .node-healthy { background: rgba(16, 185, 129, 0.2); border: 2px solid #10b981; color: #10b981; box-shadow: 0 0 10px rgba(16, 185, 129, 0.3); }
        .node-warning { background: rgba(245, 158, 11, 0.2); border: 2px solid #f59e0b; color: #f59e0b; box-shadow: 0 0 10px rgba(245, 158, 11, 0.3); }
        .node-danger { background: rgba(239, 68, 68, 0.2); border: 2px solid #ef4444; color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    </style>
</head>
<body class="h-screen flex flex-col p-6 gap-6">

    <header class="flex justify-between items-center glass-panel p-4 shrink-0">
        <div class="flex items-center gap-3">
            <svg class="w-8 h-8 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
            <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500">Tessera Cluster Intelligence</h1>
        </div>
        <div class="flex gap-4 items-center">
            <label class="font-semibold text-slate-300">Data Center Region:</label>
            <select id="region-select" class="bg-slate-800 border border-slate-600 text-white rounded px-4 py-2 outline-none focus:border-cyan-400 transition-colors cursor-pointer">
                <option value="us-east">US East (N. Virginia)</option>
                <option value="eu-west">EU West (Ireland)</option>
                <option value="ap-south">AP South (Mumbai)</option>
            </select>
        </div>
    </header>

    <main class="flex-1 grid grid-cols-12 gap-6 min-h-0">
        
        <!-- Topology Map -->
        <div class="col-span-4 glass-panel p-6 flex flex-col">
            <h2 class="text-lg font-bold mb-4 text-slate-200">Live Node Topology</h2>
            <div id="node-grid" class="flex-1 grid grid-cols-4 gap-4 place-content-start overflow-y-auto pr-2">
                <!-- Nodes generated by JS -->
            </div>
            <div class="mt-4 pt-4 border-t border-slate-700 flex justify-between text-sm font-bold">
                <span class="text-emerald-400">● Healthy: <span id="count-healthy">0</span></span>
                <span class="text-amber-400">● Degraded: <span id="count-warning">0</span></span>
                <span class="text-red-400">● Critical: <span id="count-danger">0</span></span>
            </div>
        </div>

        <!-- Metrics -->
        <div class="col-span-8 flex flex-col gap-6">
            
            <div class="glass-panel p-6 flex-1 relative">
                <h2 class="text-lg font-bold mb-2 text-slate-200">Compute Load Profile</h2>
                <div class="absolute top-6 right-6 text-3xl font-mono font-bold text-cyan-400" id="current-load">0%</div>
                <div class="h-64 w-full">
                    <canvas id="loadChart"></canvas>
                </div>
            </div>

            <div class="glass-panel p-6 flex-1 relative">
                <h2 class="text-lg font-bold mb-2 text-slate-200">Network Throughput (Gbps)</h2>
                <div class="h-48 w-full">
                    <canvas id="networkChart"></canvas>
                </div>
            </div>

        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Chart.defaults.color = '#94a3b8';
            Chart.defaults.font.family = 'system-ui';
            
            const loadCtx = document.getElementById('loadChart').getContext('2d');
            const loadChart = new Chart(loadCtx, {
                type: 'line',
                data: {
                    labels: Array.from({length: 20}, (_, i) => `-${20-i}s`),
                    datasets: [{
                        label: 'CPU Usage (%)',
                        borderColor: '#06b6d4',
                        backgroundColor: 'rgba(6, 182, 212, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        data: Array(20).fill(0)
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    animation: { duration: 0 },
                    scales: { y: { min: 0, max: 100, grid: { color: 'rgba(255,255,255,0.05)' } }, x: { grid: { display: false } } },
                    plugins: { legend: { display: false } }
                }
            });

            const netCtx = document.getElementById('networkChart').getContext('2d');
            const networkChart = new Chart(netCtx, {
                type: 'bar',
                data: {
                    labels: ['Ingress', 'Egress', 'Internal DB', 'Cache', 'Cross-Region'],
                    datasets: [{
                        label: 'Traffic (Gbps)',
                        backgroundColor: ['#3b82f6', '#8b5cf6', '#10b981', '#f59e0b', '#ef4444'],
                        data: [0, 0, 0, 0, 0],
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' } }, x: { grid: { display: false } } },
                    plugins: { legend: { display: false } }
                }
            });

            const regionSelect = document.getElementById('region-select');
            const nodeGrid = document.getElementById('node-grid');
            
            let currentNodes = [];
            let tickInterval;

            const regionConfigs = {
                'us-east': { count: 32, baseLoad: 40, vol: 10, net: [45, 30, 80, 20, 15] },
                'eu-west': { count: 24, baseLoad: 65, vol: 20, net: [20, 25, 40, 50, 5] },
                'ap-south': { count: 48, baseLoad: 85, vol: 15, net: [80, 70, 95, 10, 40] }
            };

            function generateNodes(count) {
                nodeGrid.innerHTML = '';
                currentNodes = [];
                for(let i=0; i<count; i++) {
                    const el = document.createElement('div');
                    el.className = 'node node-healthy';
                    el.innerText = `N${i+1}`;
                    nodeGrid.appendChild(el);
                    currentNodes.push(el);
                }
            }

            function updateData() {
                const config = regionConfigs[regionSelect.value];
                
                // Update Nodes
                let h = 0, w = 0, d = 0;
                currentNodes.forEach(node => {
                    const rand = Math.random() * 100;
                    const warningThreshold = 100 - (config.baseLoad / 2);
                    const dangerThreshold = 100 - (config.baseLoad / 4);
                    
                    if (rand > dangerThreshold) {
                        node.className = 'node node-danger'; d++;
                    } else if (rand > warningThreshold) {
                        node.className = 'node node-warning'; w++;
                    } else {
                        node.className = 'node node-healthy'; h++;
                    }
                });
                
                document.getElementById('count-healthy').innerText = h;
                document.getElementById('count-warning').innerText = w;
                document.getElementById('count-danger').innerText = d;

                // Update CPU Chart
                const newLoad = Math.max(5, Math.min(99, config.baseLoad + (Math.random() * config.vol * 2 - config.vol) + (d * 2)));
                document.getElementById('current-load').innerText = Math.round(newLoad) + '%';
                
                const data = loadChart.data.datasets[0].data;
                data.shift();
                data.push(newLoad);
                loadChart.update();

                // Update Network Chart
                networkChart.data.datasets[0].data = config.net.map(val => Math.max(0, val + (Math.random() * 20 - 10)));
                networkChart.update();
            }

            function handleRegionChange() {
                const config = regionConfigs[regionSelect.value];
                generateNodes(config.count);
                
                loadChart.data.datasets[0].data = Array(20).fill(config.baseLoad);
                
                updateData();
            }

            regionSelect.addEventListener('change', handleRegionChange);
            
            // Init
            handleRegionChange();
            tickInterval = setInterval(updateData, 1000);
        });
    </script>
</body>
</html>
