<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Live Flow Debugger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-200 h-screen flex flex-col">
    <header class="bg-slate-800 p-4 border-b border-slate-700 flex justify-between items-center">
        <h1 class="text-xl font-bold text-crimson-400">Live Flow Debugger</h1>
        <button class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded" onclick="runTest()">Run Test</button>
    </header>
    <div class="flex-1 flex flex-col overflow-hidden">
        <div class="h-1/2 p-6 border-b border-slate-700 flex items-center justify-center bg-slate-850">
            <div class="mermaid" id="mermaid-container">
                sequenceDiagram
                    participant Client
                    participant API
                    participant DB
                    Client->>API: HTTP POST /tx
                    API->>DB: INSERT
                    DB-->>API: OK
                    API-->>Client: 200 OK
            </div>
        </div>
        <div class="h-1/2 p-4 bg-black font-mono text-sm overflow-y-auto" id="log-pane">
            <div class="text-slate-500">Waiting for execution...</div>
        </div>
    </div>
    <script>
        mermaid.initialize({ startOnLoad: true, theme: 'dark' });
        const logs = [
            "[INFO] Receiving HTTP POST /tx from Client...",
            "[DEBUG] Payload validated successfully.",
            "[INFO] Routing to DB INSERT component.",
            "[DEBUG] Executing SQL: INSERT INTO tx...",
            "[INFO] DB returned OK.",
            "[INFO] Sending 200 OK to Client."
        ];
        function runTest() {
            const pane = document.getElementById('log-pane');
            pane.innerHTML = '';
            let i = 0;
            const interval = setInterval(() => {
                if (i >= logs.length) { clearInterval(interval); return; }
                const div = document.createElement('div');
                div.className = logs[i].includes('DEBUG') ? 'text-slate-400' : 'text-emerald-400';
                div.innerText = logs[i];
                pane.appendChild(div);
                pane.scrollTop = pane.scrollHeight;
                i++;
            }, 600);
        }
    </script>
</body>
</html>
